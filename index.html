<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="app.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="כוח מחודש">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>מערכת כוח מחודש</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Suez+One&display=swap">
<style>body{margin:0}
/* Layout: sticky top bar + one working column (max 1240px). Client page = header strip, safety strip, tabs, work area. */
/* Brand: logo red #EA2328, orange #F68247, black. Black top band carries the logo; red marks actions and the active state. */
:root{
  --bg:#F6F4F3; --surface:#FFFFFF; --surface-2:#F8F3F2; --ink:#151313; --muted:#655C5B; --line:#E5DDDB;
  --accent:#EA2328; --accent-ink:#FFFFFF; --accent-soft:#FCE6E6; --accent-text:#C81A20;
  --brand-orange:#F68247; --band:#000000; --band-ink:#FFFFFF; --band-muted:#B9B0AE;
  --up:#1F7A4A; --up-soft:#E0F2E8; --warn:#A85C0C; --warn-soft:#FBEBDA; --bad:#B42318; --bad-soft:#F9E1DE; --info:#38598F; --info-soft:#E3EAF5;
  --chart2:#F68247;
  --f-display:"Suez One","Arial Hebrew",Georgia,serif;
  --f-body:"Rubik","Arial Hebrew",Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121010; --surface:#1B1817; --surface-2:#221E1D; --ink:#F2EDEC; --muted:#A99F9D; --line:#36302F;
  --accent:#EF3B40; --accent-ink:#FFFFFF; --accent-soft:#3B1A1B; --accent-text:#FF7A7E;
  --brand-orange:#F68247; --band:#000000; --band-ink:#FFFFFF; --band-muted:#A99F9D;
  --up:#5CC98C; --up-soft:#173527; --warn:#F0A55A; --warn-soft:#3A2A16; --bad:#FF8A80; --bad-soft:#3F1E1C; --info:#8DAAE0; --info-soft:#1E2A40;
  --chart2:#F68247; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#121010; --surface:#1B1817; --surface-2:#221E1D; --ink:#F2EDEC; --muted:#A99F9D; --line:#36302F;
  --accent:#EF3B40; --accent-ink:#FFFFFF; --accent-soft:#3B1A1B; --accent-text:#FF7A7E;
  --brand-orange:#F68247; --band:#000000; --band-ink:#FFFFFF; --band-muted:#A99F9D;
  --up:#5CC98C; --up-soft:#173527; --warn:#F0A55A; --warn-soft:#3A2A16; --bad:#FF8A80; --bad-soft:#3F1E1C; --info:#8DAAE0; --info-soft:#1E2A40;
  --chart2:#F68247; color-scheme:dark;}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
*{box-sizing:border-box}
.app{direction:rtl;min-height:100%}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--band);color:var(--band-ink);border-bottom:3px solid var(--accent)}
.top-in{max-width:1480px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;flex-direction:column;align-items:center;gap:6px;white-space:nowrap;text-align:center}
.brand .wm{align-items:center}
.navcol{display:flex;flex-direction:column;align-items:center;gap:10px;margin-inline:auto}
@media (min-width:901px){.top-in{position:relative}.navcol{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);margin:0}}
.subrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.subrow:empty{display:none}
.brand img{height:72px;width:auto;display:block}
.brand .wm{display:flex;flex-direction:column;line-height:1.05}
.brand .name{font-family:var(--f-display);font-size:30px;color:var(--band-ink)}
.brand .name span{color:var(--accent)}
.brand .slogan{font-size:14px;color:var(--band-muted);margin-top:4px}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{border:0;background:transparent;color:var(--band-muted);font:inherit;font-weight:600;padding:7px 12px;border-radius:8px;cursor:pointer}
.nav button[aria-current="true"]{background:var(--accent);color:#fff}
.nav button:hover{color:var(--band-ink)}
.top-side{margin-inline-start:auto;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.top-side .who{margin-top:2px}
.top-side .save-state:empty{display:none}
.save-state{font-size:12px;color:var(--band-muted);min-width:64px}
.wrap{max-width:1480px;margin:0 auto;padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:400;font-size:36px;line-height:1.2}
h2{font-size:18px;font-weight:700}
h3{font-size:15px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:15px}
.eyebrow{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.f-label{font-size:13px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px}
.card > * + *{margin-top:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px}
.grid2 > *{min-width:0}
.btn{font:inherit;font-weight:600;font-size:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.sm{padding:5px 11px;font-size:15px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.nav button:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.clickrow:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0}
textarea{width:100%;min-height:70px;resize:vertical}
input[type=number]{font-variant-numeric:tabular-nums}
label.f[hidden]{display:none!important}
label.f{display:flex;flex-direction:column;gap:4px;font-size:15px;font-weight:600;color:var(--muted)}
label.f > input,label.f > select,label.f > textarea{font-weight:400;color:var(--ink)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.up{background:var(--up-soft);color:var(--up);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.tpbadge{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px;background:var(--accent,#EA2328);color:#fff;font-size:12px;font-weight:700;padding:0 5px;margin-inline-start:4px}
.tprep{border-top:1px solid var(--line,#e5e5e5);padding:10px 0}.tprep:first-of-type{border-top:0}.tprep.new{background:linear-gradient(90deg,transparent,rgba(234,35,40,.05))}
.tprep table td{padding:2px 8px 2px 0}
.tpgrid{display:grid;gap:8px}.tpex{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border:1px solid var(--line,#e5e5e5);border-radius:12px;padding:8px 12px}
.tpinbox{border:2px solid var(--accent,#EA2328)}.tpinrow{display:flex;gap:8px;align-items:center;width:100%;text-align:start;background:none;border:0;border-top:1px solid var(--line,#e5e5e5);padding:10px 4px;font:inherit;cursor:pointer}.tpinrow:first-of-type{border-top:0}
.tphome{border:1px solid var(--line,#e5e5e5);border-radius:12px;padding:10px;margin-top:10px}
.gfeel{white-space:nowrap}.gfeel .fb{font:inherit;font-size:15px;font-weight:700;border:2px solid var(--line,#ddd);background:#fff;border-radius:10px;padding:8px 10px;margin-inline-end:4px;cursor:pointer;min-width:58px}
.gfeel .fb.up[aria-pressed=true]{background:#2b8a3e;border-color:#2b8a3e;color:#fff}.gfeel .fb.ok[aria-pressed=true]{background:#1c7ed6;border-color:#1c7ed6;color:#fff}.gfeel .fb.warn[aria-pressed=true]{background:#e67700;border-color:#e67700;color:#fff}.gfeel .fb.bad[aria-pressed=true]{background:#c92a2a;border-color:#c92a2a;color:#fff}
.gqr .gkg input{max-width:74px}.qmode{margin:6px 0}
.chip.acc{background:var(--accent-soft);color:var(--accent-text);border-color:transparent}
button.chip{cursor:pointer;font-family:inherit}
button.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:13px;color:var(--muted)}
.kpi.bad b{color:var(--bad)} .kpi.warn b{color:var(--warn)} .kpi.up b{color:var(--up)} .kpi.info b{color:var(--info)}
.tbl-wrap{overflow-x:auto;overflow-y:hidden}textarea{resize:none!important}
table.tbl{width:100%;border-collapse:collapse;font-size:16px;font-variant-numeric:tabular-nums}
.tbl th{text-align:start;font-size:14px;font-weight:600;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.clickrow{cursor:pointer}
.clickrow:hover td{background:var(--surface-2)}
.banner{border-radius:var(--r);padding:14px 18px;font-size:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner.info{background:var(--info-soft);color:var(--info)}
.banner.acc{background:var(--accent-soft);color:var(--accent-text)}
.banner b{font-weight:700}
.empty{padding:34px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty strong{color:var(--ink);font-size:16px}
/* client page */
.chead{display:flex;gap:18px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.chead .meta{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:16px;color:var(--muted)}
.chead .meta b{color:var(--ink);font-weight:600}
.safety{border:1px solid var(--bad-soft);background:var(--bad-soft);color:var(--ink);border-radius:var(--r);padding:12px 16px;font-size:17px;display:flex;gap:8px;align-items:baseline}
.safety b{color:var(--bad);white-space:nowrap}
.safety+.safety{margin-top:6px}
.safety.med{background:#fff4e5;border-color:#ffd8a8}
.safety.med b{color:#a85d00}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:transparent;font:inherit;font-size:18px;font-weight:600;color:var(--muted);padding:10px 14px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent-text);border-bottom-color:var(--accent)}
/* session editor */
.sess-head{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.labels{display:flex;gap:6px;flex-wrap:wrap}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ex-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.ex-num{font-family:var(--f-display);font-size:20px;color:var(--accent-text);width:26px;text-align:center}
.ex-name{flex:1 1 220px;font-weight:700;font-size:15px}
.ex-body{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;padding:14px}
@media (max-width:820px){.ex-body{grid-template-columns:1fr}}
.targets{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.targets label.f{width:96px}
.targets .range{display:flex;gap:4px;align-items:center}
.targets .range input{width:52px}
.sets{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.sets th{font-size:12px;color:var(--muted);font-weight:600;text-align:start;padding:4px 6px}
.sets td{padding:3px 6px}
.sets input{width:100%;max-width:110px;font-size:16px;font-weight:600;text-align:center;padding:7px 6px}
.sets tr[data-st="top"] .dot{background:var(--up)}
.sets tr[data-st="in"] .dot{background:var(--info)}
.sets tr[data-st="low"] .dot{background:var(--warn)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--line)}
.prev{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:8px 10px;font-variant-numeric:tabular-nums}
.prev b{color:var(--ink);font-weight:600}
.sugg{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:8px 10px;border-radius:8px}
.sugg .arr{font-weight:700;font-size:15px;line-height:1.2}
.sugg.up{background:var(--up-soft);color:var(--up)}
.sugg.reps,.sugg.same{background:var(--info-soft);color:var(--info)}
.sugg.down,.sugg.stall{background:var(--warn-soft);color:var(--warn)}
.sugg.flag{background:var(--bad-soft);color:var(--bad)}
.ex-side{display:flex;flex-direction:column;gap:10px}
.ex-side .row label.f{width:90px}
.sess-foot{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;position:sticky;bottom:0;background:var(--bg);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
/* history */
.hist{display:flex;flex-direction:column;gap:12px}
.hist .tbl td:first-child{font-weight:600}
/* charts */
.chart{width:100%;height:auto;direction:ltr;display:block}
.chart text{font-family:var(--f-body);font-size:11px;fill:var(--muted)}
.chart .last{font-size:12px;font-weight:700;fill:var(--ink)}
.chart-empty{padding:30px 10px;text-align:center;color:var(--muted);font-size:14px;background:var(--surface-2);border-radius:8px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-inline-end:5px}
.delta-up{color:var(--up);font-weight:600}
.delta-down{color:var(--bad);font-weight:600}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:20;direction:rtl;max-width:calc(100% - 32px)}
.coach-pick{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--band-muted)}
.coach-pick select{background:#2A2625;color:#fff;border-color:#4A4342}
.coach-pick select{padding:5px 8px}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.tab{transition:background .15s,color .15s,border-color .15s}}
@media (max-width:560px){h1{font-size:23px}.kpi b{font-size:24px}.top-side{margin-inline-start:0}}
.ss-group{border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:10px}
.ss-head{font-weight:700;color:var(--accent-text);padding:2px 6px}
.pairgrid{display:grid;grid-template-columns:1fr;gap:36px;align-items:start}
.pairgrid > section{min-width:0}
.pairgrid .ex-body{grid-template-columns:1fr}
.pairgrid .sess-foot{position:static;background:transparent}
section[data-pane]{display:flex;flex-direction:column;gap:14px}
.pane-head{display:flex;flex-direction:column;gap:8px;padding-bottom:8px;border-bottom:2px solid var(--accent)}
.f.fake{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
label.f.inline{flex-direction:row;align-items:center;gap:6px}
.linkbtn{border:0;background:none;padding:0;font:inherit;color:var(--accent-text);text-decoration:underline;cursor:pointer}
.ex-side textarea{min-height:60px}
.ex-name{font-family:inherit}
.add-menu{gap:6px}
.sheet-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.sheet{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:16px}
.sheet th{background:var(--band);color:#fff;font-weight:600;font-size:15px;padding:10px 8px;white-space:nowrap;text-align:center;border:1px solid #2E2A29}
.sheet thead{position:sticky;top:0;z-index:2}
.sheet thead tr:first-child th{font-size:16px;letter-spacing:.02em}
.sheet th.grp-res{background:var(--accent)}
.sheet td{border:1px solid var(--line);padding:0;vertical-align:middle;text-align:center}
.sheet td.tag{font-family:var(--f-display);color:var(--accent-text);font-size:21px;min-width:50px;background:var(--surface-2)}
.sheet tr.ssr td.tag{background:var(--accent-soft)}
.sheet tr.ssr:not(.gfirst) td{border-top-style:dashed}
.sheet input,.sheet select{border:0;border-radius:0;background:transparent;width:100%;min-height:54px;text-align:center;padding:6px 8px;font-size:18px;color:var(--ink)}
.sheet input:hover,.sheet select:hover{background:var(--surface-2)}
.sheet input:focus,.sheet select:focus{outline:2px solid var(--accent);outline-offset:-2px;background:var(--surface)}
.sheet td.narrow{width:66px}
.sheet td.name{min-width:240px;text-align:start}
.sheet td.name input{text-align:start;font-weight:600}
.sheet td.notes{min-width:240px}
.hsel{width:100%;font-size:15px;padding:6px 4px}
/*all*/@media all{.sheet td.notes{position:relative;padding:0;height:64px;cursor:text}.sheet td.notes textarea{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:2em;min-height:0;max-height:100%;resize:none;overflow:hidden;text-align:center;padding:2px 8px}.sheet td.notes textarea.full{overflow:auto}}
.sheet td.notes textarea{text-align:center}
.sheet td.notes input{text-align:start;font-size:16px}
.sheet td.kg{width:100px}
.dumbtog{display:flex;gap:2px;margin-top:4px}
.dumbbtn{flex:1;font-size:11px;padding:2px 4px;border:1px solid var(--line,#ddd);border-radius:6px;background:#f8f8f8;cursor:pointer;color:var(--muted);font-family:inherit;line-height:1.3}
.dumbbtn.on{background:var(--accent,#1c7ed6);border-color:var(--accent,#1c7ed6);color:#fff;font-weight:700}
.sheet td.rngc{width:116px}
.res.eff input::placeholder{color:#c4bbb3;font-weight:400}.res.eff input{text-align:center}
.sheet .rng{display:flex;align-items:center;justify-content:center;color:var(--muted);direction:ltr}
.sheet .rng input{width:46px;padding:4px 2px}
.sheet .unitnote{font-size:11px;color:var(--muted);margin-top:-6px;padding-bottom:3px}
.sheet td.res{background:var(--surface-2);width:72px}
.sheet td.res.off{background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,var(--surface) 6px 12px)}
.sheet td.res input{font-weight:700;font-size:21px}
.sheet input[data-st="top"]{background:var(--up-soft);color:var(--up)}
.sheet input[data-st="low"]{background:var(--warn-soft);color:var(--warn)}
.sheet td.acts{white-space:nowrap;padding:0 2px}

/* ---- adapter: same shape as the artifact db the app was written for ---- */
const wDS=s=>({id:s.id,exists:s.exists(),data:()=>s.data()});
const wQS=s=>({docs:s.docs.map(wDS),size:s.size,empty:s.empty});
const clean=d=>JSON.parse(JSON.stringify(d));
function wD(ref){return {id:ref.id,path:ref.path,
  set:(d,o)=>o?setDoc(ref,clean(d),o):setDoc(ref,clean(d)),update:d=>updateDoc(ref,clean(d)),delete:()=>deleteDoc(ref),
  get:async()=>wDS(await getDoc(ref)),onSnapshot:(n,e)=>onSnapshot(ref,s=>n(wDS(s)),e)}}
function wQ(q,isColl){return {where:(f,op,v)=>wQ(query(q,where(f,op,v)),false),
  doc:id=>wD(id?doc(q,id):doc(q)),get:async()=>wQS(await getDocs(q)),onSnapshot:(n,e)=>onSnapshot(q,s=>n(wQS(s)),e)}}
const DB={collection:n=>wQ(collection(fs,n),true),doc:p=>wD(doc(fs,p))};

/* ---- auth UI ---- */
const box=document.getElementById('fbAuth'), body=document.getElementById('fbBody');
document.getElementById('fbLogo').src=(document.querySelector('.brand img')||{}).src||'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const HE={'auth/invalid-credential':'מייל או סיסמה שגויים','auth/wrong-password':'סיסמה שגויה','auth/user-not-found':'לא נמצא חשבון עם המייל הזה','auth/email-already-in-use':'כבר יש חשבון עם המייל הזה – היכנסו עם הסיסמה, או "שכחתי סיסמה"','auth/weak-password':'הסיסמה צריכה לפחות 6 תווים','auth/invalid-email':'כתובת מייל לא תקינה','auth/too-many-requests':'יותר מדי ניסיונות. נסו שוב בעוד כמה דקות','auth/popup-closed-by-user':'החלון נסגר לפני הכניסה','auth/network-request-failed':'אין חיבור לאינטרנט'};
const err=e=>HE[e&&e.code]||('שגיאה: '+(e&&e.code||e));
let mode='login';
function show(html){body.innerHTML=html;box.hidden=false;}
function msg(t,ok){const m=document.getElementById('fbMsg');if(m){m.textContent=t;m.className='msg'+(ok?' ok':'')}}
function viewLogin(){
  const signup=mode==='signup';
  show(`<h2>${signup?'כניסה ראשונה – יצירת סיסמה':'כניסה למערכת'}</h2>
  <button class="gbtn" id="fbG" type="button"><svg width="20" height="20" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>כניסה עם Google</button>
  <div class="or">או עם מייל וסיסמה</div>
  <label>מייל<input id="fbE" type="email" autocomplete="email"></label>
  <label>${signup?'בחרו סיסמה (לפחות 6 תווים)':'סיסמה'}<input id="fbP" type="password" autocomplete="${signup?'new-password':'current-password'}"></label>
  <div class="msg" id="fbMsg"></div>
  <button class="pri" id="fbGo" type="button">${signup?'יצירת סיסמה וכניסה':'כניסה'}</button>
  <button class="lnk" id="fbMode" type="button">${signup?'כבר יש לי סיסמה – כניסה':'כניסה ראשונה? יצירת סיסמה'}</button>
  ${signup?'':'<button class="lnk" id="fbForgot" type="button">שכחתי סיסמה</button>'}`);
  document.getElementById('fbG').onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){msg(err(e))}};
  document.getElementById('fbMode').onclick=()=>{mode=signup?'login':'signup';viewLogin()};
  const go=async()=>{const e=document.getElementById('fbE').value.trim(),p=document.getElementById('fbP').value;
    if(!e||!p) return msg('צריך מייל וסיסמה');
    try{ if(signup){const c=await createUserWithEmailAndPassword(auth,e,p); await sendEmailVerification(c.user).catch(()=>{});} else await signInWithEmailAndPassword(auth,e,p);}catch(x){msg(err(x))}};
  document.getElementById('fbGo').onclick=go;
  body.querySelectorAll('input').forEach(i=>i.addEventListener('keydown',ev=>{if(ev.key==='Enter')go()}));
  const f=document.getElementById('fbForgot'); if(f) f.onclick=async()=>{const e=document.getElementById('fbE').value.trim(); if(!e) return msg('כתבו קודם את המייל');
    try{await sendPasswordResetEmail(auth,e);msg('נשלח מייל לאיפוס סיסמה – בדקו גם בספאם',true)}catch(x){msg(err(x))}};
}
function viewVerify(u){
  show(`<h2>אימות מייל</h2><p>שלחנו מייל ל־<b dir="ltr">${esc(u.email)}</b>.<br>לחצו על הקישור במייל (בדקו גם בספאם), ואז על הכפתור כאן.</p>
  <div class="msg" id="fbMsg"></div><button class="pri" id="fbDone" type="button">אימתתי – כניסה</button>
  <button class="lnk" id="fbRe" type="button">שליחת המייל שוב</button><button class="lnk" id="fbOut" type="button">יציאה</button>`);
  document.getElementById('fbDone').onclick=async()=>{await u.reload(); if(auth.currentUser.emailVerified){await auth.currentUser.getIdToken(true); start(auth.currentUser)} else msg('המייל עדיין לא אומת')};
  document.getElementById('fbRe').onclick=async()=>{try{await sendEmailVerification(u);msg('נשלח שוב',true)}catch(x){msg(err(x))}};
  document.getElementById('fbOut').onclick=()=>signOut(auth);
}
function viewDenied(u){
  show(`<h2>אין עדיין הרשאה</h2><p>החשבון <b dir="ltr">${esc(u.email)}</b> עוד לא הוגדר במערכת.<br>בקשו מירין להוסיף את המייל הזה (הגדרות ← מאמנים), ואז רעננו את הדף.</p>
  <button class="pri" id="fbRetry" type="button">ניסיון שוב</button><button class="lnk" id="fbOut" type="button">כניסה עם חשבון אחר</button>`);
  document.getElementById('fbRetry').onclick=()=>start(u);
  document.getElementById('fbOut').onclick=()=>signOut(auth);
}

/* ---- gate: the app's boot() awaits claude.use('db') until a permitted user is signed in ---- */
let resolveDb, resolveUser; const dbP=new Promise(r=>resolveDb=r), userP=new Promise(r=>resolveUser=r);
let started=false;
async function start(u){
  const email=(u.email||'').toLowerCase();
  let st=null;
  try{const s=await getDoc(doc(fs,'staff',email)); st=s.exists()?s.data():null;}catch(e){st=null}
  if(!st&&OWNERS.includes(email)) st={coachId:'yarin',role:'admin'};
  if(!st||!st.coachId) return viewDenied(u);
  box.hidden=true;
  if(started){location.reload();return}
  started=true;
  resolveUser({coachId:st.coachId,role:st.role||'coach',email,can:async()=>true,canEdit:async()=>st.role==='admin',isOwner:async()=>st.role==='admin',id:()=>u.uid,me:async()=>({id:u.uid,email,name:u.displayName||''})});
  resolveDb(DB);
}
const OWNERS=['strengthismedicine@gmail.com'];
onAuthStateChanged(auth,u=>{
  if(!u){ if(started){location.reload();return} mode='login'; return viewLogin(); }
  const pw=u.providerData.some(p=>p.providerId==='password')&&!u.providerData.some(p=>p.providerId==='google.com');
  if(pw&&!u.emailVerified) return viewVerify(u);
  start(u);
});

window.FB={
  signOut:()=>signOut(auth),
  idToken:()=>auth.currentUser?auth.currentUser.getIdToken():Promise.reject(new Error('auth')),
  async setStaff(coachId,oldEmail,newEmail){
    const b=writeBatch(fs);
    if(oldEmail&&oldEmail!==newEmail) b.delete(doc(fs,'staff',oldEmail.toLowerCase()));
    if(newEmail) b.set(doc(fs,'staff',newEmail.toLowerCase()),{coachId,role:coachId==='yarin'?'admin':'coach'});
    await b.commit();
  },
  async importAll(data){ // admin-only bulk import: {collection:{id:doc}}
    let n=0; for(const [c,docs] of Object.entries(data)){ const ents=Object.entries(docs);
      for(let i=0;i<ents.length;i+=400){const b=writeBatch(fs); ents.slice(i,i+400).forEach(([id,d])=>b.set(doc(fs,c,id),clean(d))); await b.commit(); n+=Math.min(400,ents.length-i);} }
    return n;
  },
  async count(c){return (await getDocs(collection(fs,c))).size}
};
window.__fbDbP=dbP; window.__fbUserP=userP;

<script>
/* ===== הצפנה לדף המטופל: מפתח אקראי שנמצא רק בקישור שהמטופל קיבל (אחרי ה-#, לא נשלח לשרת) ===== */
var PC=(function(){
  var TE=new TextEncoder(),TD=new TextDecoder(),CH=4*1024*1024;
  function b64(buf){var a=new Uint8Array(buf),s='',C=0x8000;for(var i=0;i<a.length;i+=C)s+=String.fromCharCode.apply(null,a.subarray(i,i+C));return btoa(s)}
  function unb64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
  function b64u(a){return b64(a).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
  function unb64u(s){s=String(s).replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return unb64(s)}
  function hex(buf){var a=new Uint8Array(buf),o='';for(var i=0;i<a.length;i++)o+=(a[i]<16?'0':'')+a[i].toString(16);return o}
  function sha(bytes){return crypto.subtle.digest('SHA-256',bytes)}
  function rnd(n){return crypto.getRandomValues(new Uint8Array(n))}
  function key(raw){return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt'])}
  function wOf(raw){var a=new Uint8Array(raw.length+1);a.set(raw);a[raw.length]=119;return sha(a).then(hex)}
  function wthOf(w){return sha(TE.encode(w)).then(hex)}
  function encB(k,bytes){var iv=rnd(12);return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,bytes).then(function(ct){var o=new Uint8Array(12+ct.byteLength);o.set(iv,0);o.set(new Uint8Array(ct),12);return o})}
  function decB(k,bytes){bytes=new Uint8Array(bytes);return crypto.subtle.decrypt({name:'AES-GCM',iv:bytes.subarray(0,12)},k,bytes.subarray(12))}
  function encJ(k,obj){return encB(k,TE.encode(JSON.stringify(obj))).then(b64)}
  function decJ(k,s){return decB(k,unb64(s)).then(function(pt){return JSON.parse(TD.decode(pt))})}
  function readAB(b){if(b.arrayBuffer)return b.arrayBuffer();return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=rej;r.readAsArrayBuffer(b)})}
  /* מצפין קובץ גדול בחלקים של 4MB ומעלה אחד-אחד */
  function putBlob(k,blob,put,prog){var n=Math.max(1,Math.ceil(blob.size/CH)),i=0;
    function step(){if(i>=n)return Promise.resolve(n);return readAB(blob.slice(i*CH,(i+1)*CH)).then(function(ab){return encB(k,new Uint8Array(ab))}).then(function(ct){return put(i,ct,n)}).then(function(){i++;if(prog)prog(i/n);return step()})}
    return step()}
  function getBlob(k,n,get,type,prog){var parts=[],i=0;
    function step(){if(i>=n)return Promise.resolve(new Blob(parts,{type:type||''}));return get(i).then(function(ab){return decB(k,new Uint8Array(ab))}).then(function(pt){parts.push(pt);i++;if(prog)prog(i/n);return step()})}
    return step()}
  function id(n){return b64u(rnd(n||12)).replace(/[^A-Za-z0-9]/g,'x')}
  function rid(){var a=rnd(10),s='',c='abcdefghijklmnopqrstuvwxyz0123456789';for(var i=0;i<a.length;i++)s+=c[a[i]%36];return s}
  return {b64:b64,unb64:unb64,b64u:b64u,unb64u:unb64u,rnd:rnd,key:key,wOf:wOf,wthOf:wthOf,encB:encB,decB:decB,encJ:encJ,decJ:decJ,putBlob:putBlob,getBlob:getBlob,id:id,rid:rid}
})();

</script>

const writers = {};
const DELETED=new Set();
async function wipeClient(cid){const c=clientById(cid);const [ss,as]=await Promise.all([S.db.collection('sessions').where('clientId','==',cid).get(),S.db.collection('assessments').where('clientId','==',cid).get()]);
  for(const d of ss.docs) await delSessionDoc(d.id); for(const d of as.docs) await S.db.doc('assessments/'+d.id).delete();
  if(c&&c.partnerId&&clientById(c.partnerId)) await updClient(c.partnerId,{partnerId:''});
  await S.db.doc('clients/'+cid).delete(); S.clients=(S.clients||[]).filter(x=>x.id!==cid); return ss.size}
function delArmed(id){return S.delArm===id&&Date.now()-(S.delArmT||0)<8000}
function armDel(id){S.delArm=id;S.delArmT=Date.now();render();setTimeout(()=>{if(S.delArm===id){S.delArm=null;render()}},8000)}
function delLabel(id){return delArmed(id)?'⚠️ לחצו שוב – מחיקה סופית':'🗑️ מחיקת התוכנית'}
async function delSessionDoc(id){const path='sessions/'+id;DELETED.add(path);const w=writers[path];if(w){clearTimeout(w.timer);w.pending=null;if(w.running){try{await w.running}catch(e){}}w.waiters.splice(0).forEach(r=>r(false))}
  await S.db.doc(path).delete();
  const verify=async(n)=>{try{const x=await S.db.doc(path).get({source:'server'});if(x.exists){await S.db.doc(path).delete();if(n<3)setTimeout(()=>verify(n+1),2500);else toast('⚠️ התוכנית חזרה – כנראה פתוחה במכשיר אחר. סגרו אותה שם ונסו שוב')}else if(n===0)toast('התוכנית נמחקה ✓ (נבדק מול השרת)')}catch(e){}};
  setTimeout(()=>verify(0),1500);setTimeout(()=>verify(1),6000)}
function saveDoc(path,data,{merge=false,delay=0}={}){
  if(!S.db||!S.canWrite) return Promise.resolve(false);
  if(DELETED.has(path)) return Promise.resolve(false);
  const w = writers[path] || (writers[path]={pending:null,running:null,timer:null,waiters:[]});
  if(merge && w.pending && w.pending.merge) Object.assign(w.pending.data,clone(data)); else w.pending={data:clone(data),merge};
  clearTimeout(w.timer);
  setSave('pending');
  return new Promise(res=>{w.waiters.push(res);w.timer=setTimeout(()=>flush(path),delay)});
}
async function flush(path){
  const w=writers[path]; if(!w) return;
  if(w.running){ await w.running; }
  if(!w.pending) return;
  const p=w.pending; w.pending=null; const waiters=w.waiters.splice(0);
  setSave('saving');
  let ok=true;
  w.running=(p.merge?S.db.doc(path).update(p.data):S.db.doc(path).set(p.data))
    .catch(e=>{ok=false;onWriteError(e)})
    .finally(()=>{w.running=null});
  await w.running;
  waiters.forEach(r=>r(ok));
  if(w.pending) flush(path); else setSave(ok?'saved':'error');
}
function hasPending(path){const w=writers[path];return !!(w&&(w.pending||w.running))}
function onWriteError(e){
  if(e&&e.code==='invalid_argument'){S.canWrite=false;toast('אין לכם הרשאת עריכה בדף הזה – השינויים לא נשמרו');render();return}
  if(e&&e.code==='quota_exceeded'){toast('מאגר הנתונים מלא – פנו לירין');return}
  toast('השמירה נכשלה – בדקו חיבור ונסו שוב');
}
let saveT;
function setSave(st){const el=$('#saveState');clearTimeout(saveT);
  el.textContent=st==='saving'||st==='pending'?'שומר…':st==='saved'?'נשמר ✓':st==='error'?'שגיאה בשמירה':'';
  if(st==='saved') saveT=setTimeout(()=>el.textContent='',2500);}
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3400)}

function periodicDue(c){const base=c.lastAssessmentDate||c.startDate; return !!base&&daysSince(base)>=60}
function assessDue(c){ if(c.lastAssessmentDate) return daysSince(c.lastAssessmentDate)>=60; return daysSince(c.startDate||isoOf(c.createdAt))>14; }
function clientFlags(c){
  const f=[];
  if(S.tpNew&&S.tpNew[c.id]&&tpMine(c)) f.push(['acc',`📩 ${S.tpNew[c.id]} חדשים מהמתאמן`]);
  if(c.pendingApproval) f.push(['warn','תוכנית ממתינה לאישור']);
  else if(!c.hasPlan) f.push(['warn','אין אימון מתוכנן']);
  if(!c.lastSessionDate){ if(daysSince(c.startDate||isoOf(c.createdAt))>7) f.push(['bad','טרם נרשמו תוצאות']); }
  else if(daysSince(c.lastSessionDate)>14) f.push(['bad',`לא עודכן ${daysSince(c.lastSessionDate)} ימים`]);
  if(c.painDate&&daysSince(c.painDate)<=14) f.push(['bad','דווח כאב 4+']);
  if(assessDue(c)) f.push(['info',c.lastAssessmentDate?'מבדק תקופתי באיחור':'חסר מבדק פתיחה']);
  return f;
}

/* ---------- charts ---------- */
function niceStep(raw){const p=Math.pow(10,Math.floor(Math.log10(raw||1)));const f=raw/p;return (f<1.5?1:f<3?2:f<7?5:10)*p}
function lineChart(pts,{color='var(--accent)',unit=''}={}){
  if(pts.length<2) return `<div class="chart-empty">צריך לפחות שתי מדידות כדי להציג מגמה</div>`;
  const W=560,H=210,pl=46,pr=60,pt=18,pb=30;
  const xs=pts.map(p=>Date.parse(p.x)), ys=pts.map(p=>p.y);
  let x0=Math.min(...xs),x1=Math.max(...xs); if(x0===x1){x0-=864e5;x1+=864e5}
  let y0=Math.min(...ys),y1=Math.max(...ys); if(y0===y1){y0-=1;y1+=1}
  const step=niceStep((y1-y0)/4); y0=Math.floor(y0/step)*step; y1=Math.ceil(y1/step)*step;
  const X=x=>pl+(x-x0)/(x1-x0)*(W-pl-pr), Y=y=>pt+(1-(y-y0)/(y1-y0))*(H-pt-pb);
  let g='';
  for(let v=y0; v<=y1+1e-9; v+=step){const yy=Y(v).toFixed(1);g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${pl-8}" y="${+yy+4}" text-anchor="end">${+v.toFixed(2)}</text>`}
  const idx=[0,Math.floor((pts.length-1)/2),pts.length-1].filter((v,i,a)=>a.indexOf(v)===i);
  idx.forEach(i=>{g+=`<text x="${X(xs[i]).toFixed(1)}" y="${H-8}" text-anchor="middle">${fmt(pts[i].x)}</text>`});
  const line=pts.map((p,i)=>`${i?'L':'M'}${X(xs[i]).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
  const area=`${line}L${X(xs[xs.length-1]).toFixed(1)},${Y(y0)}L${X(xs[0]).toFixed(1)},${Y(y0)}Z`;
  const dots=pts.map((p,i)=>`<circle cx="${X(xs[i]).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${i===pts.length-1?5:3}" fill="${i===pts.length-1?color:'var(--surface)'}" stroke="${color}" stroke-width="2"/>`).join('');
  const L=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="גרף מגמה">${g}<path d="${area}" fill="${color}" fill-opacity=".10"/><path d="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>${dots}<text class="last" x="${(X(xs[xs.length-1])+9).toFixed(1)}" y="${(Y(L.y)+4).toFixed(1)}">${+L.y.toFixed(2)}${unit?' '+esc(unit):''}</text></svg>`;
}

document.addEventListener('input',e=>{if(!e.target.matches)return;if(e.target.matches('.sheet td.notes textarea, .ptab td.pnotes textarea'))fitNote(e.target);else if(e.target.matches(GROW_SEL))autoGrow(e.target)},true);
let _idT;document.addEventListener('input',e=>{const t=e.target;if(!t.dataset||!t.dataset.introdoc)return;const c=clientById(t.dataset.introdoc);if(!c)return;c.introDoc=t.value;clearTimeout(_idT);_idT=setTimeout(()=>updClient(c.id,{introDoc:c.introDoc}),900)},true);
document.addEventListener('click',e=>{const td=e.target.closest&&e.target.closest('.sheet td.notes, .ptab td.pnotes');if(td&&e.target===td){const ta=td.querySelector('textarea');if(ta){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length)}}});
function editorFocused(){const a=document.activeElement;return !!(a&&a.closest&&a.closest('#main')&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))}
function scheduleRender(){ if(editorFocused()){S.deferred=true;return} render(); }

function vDashboard(){
  if(!S.loaded.k) return `<div class="empty"><strong>טוען מתאמנים…</strong></div>`;
  const act=activeClients();
  const d=new Date();
  const head=`<div class="spread"><div><div class="eyebrow">${d.toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div><h1>לוח בקרה</h1></div>
    <button class="btn primary" data-act="newClientGo" data-write>+ מתאמן חדש</button></div>`;
  if(!act.length) return head+`<div class="card empty"><strong>עדיין אין מתאמנים במערכת</strong><span>הוסיפו מתאמן ראשון, מלאו את התיק שלו ובנו את האימון הראשון. מכאן הלוח יתחיל להראות מי אומן, מי ממתין לתוכנית ומי צריך מבדק.</span><button class="btn primary" data-act="newClientGo" data-write>+ מתאמן חדש</button></div>`;

  const pend=act.filter(c=>c.pendingApproval).length;
  const stl=act.filter(stale).length;
  const due=act.filter(assessDue).length;

  const kpis=`<div class="kpis">
    <div class="kpi"><b>${act.length}</b><span>מתאמנים פעילים</span></div>
    <div class="kpi up"><b>${trained}</b><span>עם תוצאות מ-7 הימים האחרונים</span></div>
    <div class="kpi warn"><b>${pend}</b><span>תוכניות ממתינות לאישור מאמן</span></div>
    <div class="kpi bad"><b>${stl}</b><span>לא עודכנו 14+ ימים</span></div>
    <div class="kpi info"><b>${due}</b><span>מבדק תקופתי נדרש</span></div>
    <div class="kpi bad"><b>${pain}</b><span>דיווחי כאב 4+ בשבועיים</span></div></div>`;
  const att=act.map(c=>({c,f:clientFlags(c)})).filter(x=>x.f.length).sort((a,b)=>b.f.filter(f=>f[0]==='bad').length-a.f.filter(f=>f[0]==='bad').length||b.f.length-a.f.length);
  const attHtml=`<div class="card"><div class="spread"><h2>דורש טיפול</h2><span class="muted small">${att.length} מתוך ${act.length}</span></div>
    ${att.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>מתאמן</th><th>מאמן</th><th>אימון אחרון</th><th>מה חסר</th></tr></thead><tbody>
    ${att.slice(0,40).map(({c,f})=>`<tr class="clickrow" tabindex="0" data-open="${c.id}"><td><b>${esc(c.name)}</b></td><td>${esc(coachName(c.coachId))}</td><td>${fmt(c.lastSessionDate)}</td><td><div class="row">${f.map(x=>`<span class="chip ${x[0]}">${esc(x[1])}</span>`).join('')}</div></td></tr>`).join('')}
    </tbody></table></div>`:`<div class="empty"><strong>הכול מעודכן</strong><span>לכל המתאמנים הפעילים יש תוצאות עדכניות, תוכנית מאושרת ומבדק בתוקף.</span></div>`}</div>`;
  const coachRows=S.coaches.filter(k=>k.active!==false).map(k=>{const cs=act.filter(c=>c.coachId===k.id);
    return {k,n:cs.length,t:cs.filter(c=>daysSince(c.lastSessionDate)<=7).length,p:cs.filter(c=>c.pendingApproval).length,s:cs.filter(stale).length,a:cs.filter(assessDue).length}});
  const noCoach=act.filter(c=>!S.coaches.some(k=>k.id===c.coachId)).length;
  const coachHtml=`<div class="card"><h2>לפי מאמן</h2><div class="tbl-wrap"><table class="tbl"><thead><tr><th>מאמן</th><th>מתאמנים</th><th>עודכנו השבוע</th><th>ממתינים לאישור</th><th>לא עודכנו 14+</th><th>מבדק נדרש</th></tr></thead><tbody>
    ${coachRows.map(r=>`<tr class="clickrow" tabindex="0" data-coachfilter="${r.k.id}"><td><b>${esc(r.k.name)}</b></td><td>${r.n}</td><td>${r.n?Math.round(r.t/r.n*100)+'%':'—'} <span class="muted small">(${r.t})</span></td><td>${r.p||'—'}</td><td>${r.s?`<span class="chip bad">${r.s}</span>`:'—'}</td><td>${r.a||'—'}</td></tr>`).join('')}

}

/* ---------- manager ---------- */
function vManager(){
  if(!S.loaded.k) return `<div class="empty"><strong>טוען…</strong></div>`;
  const act=activeClients();
  const gap=c=>daysSince(c.lastSessionDate||c.startDate);
  /* ליווי מרחוק וקבוצה לא נספרים כאן; מי שעוד אין לו אימון מתועד מופיע ברשימה נפרדת */
  const inStudio=act.filter(c=>c.trainingType!=='remote'&&c.trainingType!=='group'&&!c.remote);
  const absent=inStudio.filter(c=>c.lastSessionDate&&gap(c)>=14).sort((a,b)=>gap(b)-gap(a));
  const noLog=inStudio.filter(c=>!c.lastSessionDate&&daysSince(c.startDate||'')>=7);
  const rows=absent.map(c=>{const g=gap(c);return `<tr class="clickrow" tabindex="0" data-open="${c.id}"><td><b>${esc(c.name)}</b></td><td>${esc(coachName(c.coachId))}</td><td>${c.lastSessionDate?fmt(c.lastSessionDate):'עדיין לא התאמן'}</td><td>${g===Infinity?'—':`<span class="chip ${g>=28?'bad':'warn'}">${g} ימים</span>`}</td></tr>`}).join('');
  const coaches=S.coaches.filter(k=>k.active!==false).map(k=>{const cs=act.filter(c=>c.coachId===k.id);
    return `<tr class="clickrow" tabindex="0" data-mgrcoach="${k.id}"><td><b>${esc(k.name)}</b></td><td>${cs.length}</td><td>${cs.filter(c=>daysSince(c.lastSessionDate)<=7).length}</td><td>${cs.filter(c=>absent.includes(c)).length||'—'}</td><td>${cs.filter(c=>c.handoff&&c.handoff.text).length||'—'}</td></tr>`}).join('');
  /* duplicate clients (same name) */
  const allAct=S.clients.filter(c=>(c.status||'active')==='active');
  const nameMap={};allAct.forEach(c=>{const n=(c.name||'').trim().toLowerCase();if(n){if(!nameMap[n])nameMap[n]=[];nameMap[n].push(c);}});
  const dups=Object.values(nameMap).filter(arr=>arr.length>1);
  const dupsHtml=dups.length?`<div class="card" style="border:2px solid var(--warn)"><div class="spread"><h2 style="margin:0">⚠️ מתאמנים עם שם זהה</h2><span class="muted small">ייתכן שנוצרו בטעות כרטיסים כפולים – בדקו ומזגו אם צריך</span></div>
  ${dups.map(arr=>`<div style="margin-top:12px;padding:10px;background:var(--bg2);border-radius:8px"><b>${esc(arr[0].name)}</b><div class="row" style="margin-top:8px;flex-wrap:wrap;gap:8px">${arr.map(c=>`<div style="display:flex;align-items:center;gap:8px"><button class="btn ghost sm" data-open="${c.id}">${esc(c.name)} · ${esc(coachName(c.coachId))} · ${c.lastSessionDate?fmt(c.lastSessionDate):'ללא אימון'}</button><button class="btn danger sm" data-act="mergeInto" data-keep="${arr.find(x=>x!==c)&&arr.find(x=>x!==c).id}" data-del="${c.id}" data-write>מזג והסר זה</button></div>`).join('')}</div></div>`).join('')}</div>`:'';
  /* exercise names editing */
  const exGrpNames={lower:'רגליים',upper:'פלג גוף עליון',core:'ליבה',balance:'שיווי משקל'};
  const byGrp={};LIB.forEach(l=>{const g=l[2]||'other';if(!byGrp[g])byGrp[g]=[];byGrp[g].push(l[0]);});
  const exNamesHtml=`<div class="card"><h2>שמות תרגילים</h2><p class="muted small">עורכים את השם כאן, והוא משתנה מיד בכל התוכניות וברשימת הבחירה.</p>
  ${Object.entries(exGrpNames).filter(([k])=>byGrp[k]).map(([k,title])=>`<details style="margin-bottom:8px"><summary style="cursor:pointer;padding:6px 0;font-weight:600">${title} (${(byGrp[k]||[]).length})</summary><div class="tbl-wrap"><table class="tbl" style="margin-top:6px"><thead><tr><th>שם התרגיל (עריכה משנה אותו בכל התוכניות)</th></tr></thead><tbody>${(byGrp[k]||[]).map(orig=>`<tr><td><input type="text" data-exname="${esc(orig)}" value="${esc((S.exNames&&S.exNames[orig])||orig)}" style="width:100%;min-width:200px"></td></tr>`).join('')}</tbody></table></div></details>`).join('')}</div>`;
  return `<div class="mgr"><h1>ניהול</h1>
   ${dupsHtml}
   <div class="card"><div class="spread"><h2>לא התאמנו שבועיים ומעלה</h2><span class="muted small">${absent.length} מתוך ${inStudio.length} מתאמנים בסטודיו</span></div>
   <span class="muted small">לשיחת "מתגעגעים אליך" לפני שהם עוזבים. לחיצה על שורה פותחת את התיק.</span>
   ${absent.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>מתאמן</th><th>מאמן</th><th>אימון אחרון</th><th>לא התאמן</th></tr></thead><tbody>${rows}</tbody></table></div>`:`<div class="empty"><strong>כולם התאמנו בשבועיים האחרונים 👏</strong></div>`}
   ${noLog.length?`<details style="margin-top:10px"><summary class="muted">עוד אין אימון מתועד במערכת: ${noLog.length} מתאמנים (כדאי שהמאמן יתעד את האימון הבא)</summary><div class="row" style="margin-top:6px;flex-wrap:wrap">${noLog.map(c=>`<button class="btn ghost sm" data-open="${c.id}">${esc(c.name)} · ${esc(coachName(c.coachId))}</button>`).join('')}</div></details>`:''}</div>
   <div class="card"><h2>לפי מאמן</h2><div class="tbl-wrap"><table class="tbl"><thead><tr><th>מאמן</th><th>מתאמנים פעילים</th><th>תועדו ב־7 ימים</th><th>לא התאמנו 14+</th><th>הערות פתוחות</th></tr></thead><tbody>${coaches}</tbody></table></div></div>
   ${exNamesHtml}</div>`;
}

/* ---------- group training (one shared plan, per-member results) ---------- */
function gid(name){let h=0;for(const ch of String(name))h=(h*31+ch.charCodeAt(0))>>>0;return 'g_'+h.toString(36)}
function isPairKey(n){return String(n||'').startsWith('pair:')}
function pairKey(c){return c&&c.partnerId?'pair:'+[c.id,c.partnerId].sort().join(':'):''}
function gTitle(n){if(!isPairKey(n))return n;const ns=String(n).split(':').slice(1).map(id=>(clientById(id)||{}).name||'').filter(Boolean);
  if(ns.length===2){const a=ns[0].trim().split(/\s+/),b=ns[1].trim().split(/\s+/);if(a.length>1&&b.length>1&&a[a.length-1]===b[b.length-1])return a.slice(0,-1).join(' ')+' ו'+b.slice(0,-1).join(' ')+' '+a[a.length-1]}
  return ns.join(' ו')}
function freqTxt(n){n=Number(n)||1;return n===1?'פעם בשבוע':n===2?'פעמיים בשבוע':n+' פעמים בשבוע'}
function pairsOfCoach(coachId){const seen={},o=[];S.clients.filter(c=>ttype(c)==='pair'&&c.partnerId&&(c.status||'active')==='active'&&c.coachId===coachId).forEach(c=>{const k=pairKey(c);if(!seen[k]&&clientById(c.partnerId)){seen[k]=1;o.push(k)}});return o}
function groupMembers(name){if(isPairKey(name))return String(name).split(':').slice(1).map(id=>clientById(id)).filter(Boolean);return S.clients.filter(c=>ttype(c)==='group'&&(c.groupName||'קבוצה')===name&&(c.status||'active')==='active').sort((a,b)=>String(a.name).localeCompare(String(b.name),'he'))}
function groupsOfCoach(coachId){const m={};S.clients.filter(c=>ttype(c)==='group'&&c.coachId===coachId&&(c.status||'active')==='active').forEach(c=>{const n=c.groupName||'קבוצה';m[n]=(m[n]||0)+1});return Object.entries(m)}
function openGroup(name,isIntro){
  closeClient(); closeGroup();
  const G={name,id:gid(name),sessions:[],loaded:false,msess:[],edit:null,isIntro:!!isIntro};
  S.G=G; S.view='group';
  G.unsub=S.db.collection('sessions').where('clientId','==',G.id).onSnapshot(snap=>{try{snap.docChanges().forEach(ch=>{if(ch.type==='removed'){DELETED.add('sessions/'+ch.doc.id);if(G.edit&&G.edit.id===ch.doc.id)G.edit=null}})}catch(e){}G.sessions=snap.docs.map(d=>({id:d.id,...d.data()}));G.loaded=true;scheduleRender()},dbErr);
  const ids=groupMembers(name).map(c=>c.id).slice(0,10);
  if(ids.length) G.unsub2=S.db.collection('sessions').where('clientId','in',ids).onSnapshot(snap=>{G.msess=snap.docs.map(d=>({id:d.id,...d.data()}));scheduleRender()},()=>{});
  render(); window.scrollTo(0,0);
}
function closeGroup(){const G=S.G; if(G){if(G.unsub)G.unsub(); if(G.unsub2)G.unsub2();} S.G=null;}
function gMemCtx(cid){return {sessions:(S.G?S.G.msess:[]).filter(s=>s.clientId===cid)}}
function gNewEx(base){const e={...newExercise(),...(base||{})}; e.m={}; return e}
function gEnsureMembers(doc){const ms=groupMembers(S.G.name); (doc.exercises||[]).forEach(ex=>{ex.m=ex.m||{}; ms.forEach(c=>{if(!ex.m[c.id]) ex.m[c.id]={kg:ex.targetKg??'',sets:Array.from({length:Number(ex.targetSets)||2},()=>''),pain:'',adapt:''}; const mm=ex.m[c.id]; if(doc.intro&&tOnly(ex.name,true)&&(mm.kg===''||mm.kg==null))mm.kg='1-2'; while(mm.sets.length<(Number(ex.targetSets)||2))mm.sets.push(''); while(mm.sets.length>(Number(ex.targetSets)||2)&&mm.sets[mm.sets.length-1]==='')mm.sets.pop();})}); doc.members=ms.map(c=>c.id); return doc}
function gSave(delay){const G=S.G; if(!G||!G.edit) return; return saveDoc('sessions/'+G.edit.id,G.edit.doc,{delay:delay??700})}
const FEEL=[['easy','קל','up'],['ok','בינוני','ok'],['hard','קשה','warn'],['pain','כאב','bad']];
const FEEL_RPE={easy:5,ok:7,hard:9,pain:8};
function gQuick(d){return !isPairKey(S.G&&S.G.name)&&d.quick!==false}
function gTop(ex){return isUnilateral(ex.name)?8:Math.min(12,num(ex.repMax)||12)}
function gR(ex,mm){return num(mm.r)??num(ex.repMin)??8}
/* התקדמות לפי תחושה: קל = מוסיפים משקל; בינוני = עוד חזרה, ובתקרה משקל וחוזרים לתחתית; קשה פעמיים = יורדים; כאב = לא מתקדמים ובודקים */
function gProg(ex,mm){
  const u=unitOf({...ex,targetKg:mm.kg}), kg=num(mm.kg), r=gR(ex,mm), lo=Math.max(num(ex.repMin)??6,isUnilateral(ex.name)?6:8), top=gTop(ex), st=stepFor(ex.group,kg||0), f=mm.feel||'';
  let nk=kg, nr=r, t='', ok=0, hd=0;
  if(f==='easy'){ if(u==='kg'&&kg!=null){nk=r05(kg+st);t=`★ היה קל: +${st} ק״ג`} else if(r+2<=top){nr=r+2;t='★ היה קל: +2 חזרות'} else {nr=lo;t='★ היה קל: להקשות את המנח ולחזור ל־'+lo} }
  else if(f==='ok'){ ok=(mm.okRun||0)+1; if(r<top){nr=r+1;t='בינוני: עוד חזרה'} else if(u==='kg'&&kg!=null){nk=r05(kg+st);nr=lo;t=`★ הגיע ל־${top}: +${st} ק״ג וחוזרים ל־${lo}`} else {nr=lo;t=`★ הגיע ל־${top}: להקשות את המנח ולחזור ל־${lo}`} }
  else if(f==='hard'){ hd=(mm.hardRun||0)+1; if(hd>=2){ if(u==='kg'&&kg){nk=Math.max(0,r05(kg-st));t=`קשה פעמיים: −${st} ק״ג`} else {nr=Math.max(lo,r-2);t='קשה פעמיים: פחות חזרות'} hd=0 } else t='היה קשה: נשארים באותו עומס' }
  else if(f==='pain') t='⚠ דווח כאב: לא מתקדמים, לבדוק ולהתאים';
  else t=mm.sugg&&!/^⚠|^★|^בינוני|^היה|^קשה/.test(mm.sugg)?mm.sugg:'לא סומן: אותו עומס';
  return {kg:nk==null?'':nk,r:nr,sugg:t,okRun:ok,hardRun:hd};
}

/* ---------- אימון זוגי: טבלה כמו באימון האישי, שורה לכל אחד מבני הזוג ---------- */
function pairBlocks(exs,tags){const bl=[];tags.forEach((tg,i)=>{if(tg.first)bl.push({n:tg.n,ss:tg.ss,idx:exs.map((e,j)=>j).filter(j=>tags[j].n===tg.n)})});return bl}
function pairNow(d,ms,bl){if(ms.length!==2||bl.length<2)return null;const k=((d.rot||0)%bl.length+bl.length)%bl.length;return {k,A:bl[k],B:bl[(k+1)%bl.length]}}
function pairTable(d,ms,exs,tags){
  const nSets=d.intro?0:Math.max(2,...exs.map(e=>Number(e.targetSets)||0));const bl=pairBlocks(exs,tags);const now=pairNow(d,ms,bl);
  const lab=b=>b?(b.ss?'סופר סט ':'תרגיל ')+b.n:'';
  const nowOf=(cid,i)=>{
    if(d.intro&&ms.length===2){
      const rot=d.rot||0;
      const totalSS=Math.ceil(exs.length/2);
      if(rot>=totalSS*4) return false;
      const blockIdx=Math.floor(rot/4);
      const swapped=rot%2===1;
      const tg=tags[i];
      if(!tg||String(tg.n)!==String(blockIdx+1)) return false;
      const blockExIdxs=exs.map((_,j)=>j).filter(j=>tags[j]&&tags[j].n===tg.n);
      const posInBlock=blockExIdxs.indexOf(i);
      if(posInBlock===-1) return false;
      const isA=cid===ms[0].id;
      return swapped?(isA?posInBlock===1:posInBlock===0):(isA?posInBlock===0:posInBlock===1);
    }
    if(!now)return false;const b=cid===ms[0].id?now.A:now.B;return b.idx.includes(i);
  };
  const strip='';
  const head=`<thead><tr><th colspan="4" class="grp-plan">תוכנית</th><th colspan="2"></th>${nSets?`<th colspan="${nSets}" class="grp-res">תוצאות</th>`:''}<th colspan="2"></th></tr>
   <tr><th>תרגיל</th><th>סטים</th><th>חזרות</th><th>הערות / טמפו</th><th>מי</th><th>משקל עבודה</th>${Array.from({length:nSets},(_,j)=>`<th class="setcol">סט ${j+1}</th>`).join('')}<th>התאמה אישית</th><th>סדר</th></tr></thead>`;
  let body='';
  exs.forEach((ex,i)=>{const tg=tags[i];const sec=unitOf(ex)==='sec';
    if(tg.first&&(tg.ss||exs.some(e=>e.ss)))body+=`<tr class="gsep"><td colspan="${nSets+8}"><span>${tg.ss?`סופר סט ${tg.n}`:`תרגיל ${tg.n}`}</span></td></tr>`;
    ms.forEach((c,k)=>{const mm=ex.m[c.id]||{sets:[]};const first=k===0;const prev=mm.off?'':prevShort(gMemCtx(c.id),ex,null);
      const shared=first?`<td class="pname" rowspan="${ms.length}"><span class="nmwrap"><span class="nmview">${esc(dn(ex.name))||'<span class="muted">שם התרגיל</span>'}</span><input class="gn" list="lib" data-gf="name" data-ei="${i}" value="${esc(dn(ex.name))}" placeholder="שם התרגיל"></span>${barHint(ex.name)&&!isSmithPush(ex.name)?`<div class="unihint">⚖️ ${barHint(ex.name)}</div>`:''}</td>
        <td class="narrow" rowspan="${ms.length}">${d.intro?`<b>2</b>`:`<div class="stepv" data-stepk="sets"><button type="button" class="stp-a" data-step="1" aria-label="להוסיף">▲</button><input type="number" min="1" max="6" data-gf="targetSets" data-ei="${i}" value="${esc(ex.targetSets)}"><button type="button" class="stp-a" data-step="-1" aria-label="להוריד">▼</button></div>`}</td>
        <td class="rngc" rowspan="${ms.length}">${d.intro?`<b dir="ltr">6–8</b>`:`<div class="stepv" data-stepk="rng"><button type="button" class="stp-a" data-step="1" aria-label="להוסיף">▲</button><span class="rng"><input type="number" min="0" data-gf="repMin" data-ei="${i}" value="${esc(ex.repMin)}"><span class="rngsep">–</span><input type="number" min="0" data-gf="repMax" data-ei="${i}" value="${num(ex.repMax)!=null&&num(ex.repMax)!==num(ex.repMin)?esc(ex.repMax):''}"></span><button type="button" class="stp-a" data-step="-1" aria-label="להוריד">▼</button></div>`}${sec?'<div class="muted small">שניות</div>':''}</td>
        <td class="pnotes" rowspan="${ms.length}"><textarea data-gf="tempo" data-ei="${i}" rows="2" placeholder="${ex.tempoHint?esc('במפגש ההיכרות: '+ex.tempoHint):'טמפו, מנח, דגשים'}">${esc(ex.tempo||'')}</textarea></td>`:'';
      const acts=first?`<td class="acts" rowspan="${ms.length}"><button class="btn ghost sm${S.gPain===i?' painon':''}" data-act="gPain" data-ei="${i}" data-tip="כאב – הצעה לשינוי מנח">🤕</button><span class="mvcol"><button class="btn ghost sm" data-act="gUp" data-ei="${i}" data-tip="למעלה" ${i===0?'disabled':''} data-write>▲</button><button class="btn ghost sm" data-act="gDown" data-ei="${i}" data-tip="למטה" ${i===exs.length-1?'disabled':''} data-write>▼</button></span><button class="btn ghost sm" data-act="gDel" data-ei="${i}" data-tip="מחיקת התרגיל" data-write>✕</button></td>`:'';
      const who=`<td class="pwho p${k}"><b>${esc(String(c.name).split(' ')[0])}</b>${mm.off?'':` <button class="linkbtn tiny padaptbtn${S.gAdapt===`${i}-${c.id}`?' on':''}" data-act="gAdapt" data-ei="${i}" data-cid="${c.id}" data-tip="התאמת תרגיל עבור ${esc(String(c.name).split(' ')[0])}">✎</button>`}${prev?`<div class="prevline">${esc(prev)}</div>`:''}${!mm.off&&mm.sugg?`<div class="sghint">${esc(mm.sugg)}${mm.skg!=null&&num(mm.skg)!==num(mm.kg)?` <button class="linkbtn tiny" data-act="gApply" data-ei="${i}" data-cid="${c.id}" data-write>החלה (${mm.skg} ק״ג)</button>`:''}</div>`:''}</td>`;
      let rest;
      if(mm.off) rest=`<td colspan="${nSets+2}" class="poff"><span class="muted">לא בתוכנית של ${esc(String(c.name).split(' ')[0])}</span> <button class="linkbtn tiny" data-act="gOn" data-ei="${i}" data-cid="${c.id}" data-write>להוסיף</button></td>`;
      else { const kgc=d.intro&&isIntroSquat(ex.name)?`<span class="nokg">ללא משקל</span>`:isSmithPush(ex.name)?`<select data-gm="height" data-ei="${i}" data-cid="${c.id}" class="hsel">${(d.intro?[7,6,5]:[7,6,5,4,3,2,1]).map(h=>`<option value="${h}"${(Number(mm.height)||7)===h?' selected':''}>גובה ${h}</option>`).join('')}</select>${d.intro&&first?`<div class="muted small" style="font-size:12px;white-space:nowrap">7 קל ← 5 קשה</div>`:''}`:`${d.intro||sec?'':'<div class="stepv" data-stepk="kg" data-inc="'+(isDumbbell(ex.name)?1:2.5)+'"><button type="button" class="stp-a" data-step="1" aria-label="להוסיף">▲</button>'}<input type="text" inputmode="decimal" data-gm="kg" data-ei="${i}" data-cid="${c.id}" value="${esc(mm.kg)}" placeholder="${sec?'—':isBW(ex.name)?'משקל גוף':''}">${d.intro||sec?'':'<button type="button" class="stp-a" data-step="-1" aria-label="להוריד">▼</button></div>'}${tOnly(ex.name,d.intro)?`<div class="muted small" style="font-size:12px">בסה״כ</div>`:first&&isDumbbell(ex.name)?`<div class="dumbtog"><button type="button" class="dumbbtn${(ex.dumbSide||'each')==='each'?' on':''}" data-act="dumbSideG" data-v="each" data-ei="${i}" data-write>כל יד</button><button type="button" class="dumbbtn${ex.dumbSide==='total'?' on':''}" data-act="dumbSideG" data-v="total" data-ei="${i}" data-write>בסה״כ</button></div>`:''}`;
        const L=mm.sets.length;
        rest=`<td class="gkg">${kgc}</td>${Array.from({length:nSets},(_,j)=>j<L?`<td class="res"><input class="si" type="number" min="0" inputmode="numeric" data-gm="rep" data-si="${j}" data-ei="${i}" data-cid="${c.id}" value="${esc(mm.sets[j])}" data-st="${setState(ex,{reps:mm.sets[j]})}" aria-label="${esc(c.name)} סט ${j+1}"><span class="stp"><button type="button" tabindex="-1" data-step="1" aria-label="עוד חזרה">▲</button><button type="button" tabindex="-1" data-step="-1" aria-label="חזרה פחות">▼</button></span>${j===L-1&&first?`${L<6?`<button type="button" class="addset" data-act="gSetAdd" data-ei="${i}" data-tip="הוספת סט" data-write>+</button>`:''}${L>1?`<button type="button" class="addset delset" data-act="gSetDel" data-ei="${i}" data-tip="הורדת סט" data-write>−</button>`:''}`:''}</td>`:'<td class="res off"></td>').join('')}
         <td class="gadapt"><input data-gm="adapt" data-ei="${i}" data-cid="${c.id}" value="${esc(mm.adapt||'')}" placeholder=""></td>`}
      body+=`<tr class="prow p${k}${nowOf(c.id,i)?' now':''}${k===ms.length-1?' plast':''}" data-gex="${i}">${shared}${who}${rest}${acts}</tr>`;
      if(S.gAdapt===`${i}-${c.id}`)body+=`<tr class="adaptrow"><td colspan="${nSets+8}"><div class="adaptpanel"><label>תרגיל חלופי: <input type="text" data-gm="adaptEx" data-ei="${i}" data-cid="${c.id}" value="${esc((ex.m[c.id]||{}).adaptEx||'')}" placeholder="שם תרגיל חלופי"></label><button class="btn ghost sm" data-act="gOff" data-ei="${i}" data-cid="${c.id}" data-write style="margin-inline-start:4px">הוצא מהתוכנית</button></div></td></tr>`});
    if(S.gPain===i)body+=`<tr class="painrow"><td colspan="${nSets+8}"><div class="banner bad" style="margin:4px 0"><span><b>🤕 כאב? קודם כל לנסות לשנות מנח:</b> ${painTip(ex.name)} <span class="muted small">אפשר לרשום ב"התאמה אישית" מה שונה.</span></span></div></td></tr>`;
    if(d.intro&&ms.length===2&&tg.first&&i+1<exs.length&&tags[i+1]&&tags[i+1].n===tg.n){
      const rot=d.rot||0;const totalSS=Math.ceil(exs.length/2);const ssBlockIdx=Number(tg.n)-1;const curBlock=Math.floor(rot/4);const done=rot>=totalSS*4;const isCur=curBlock===ssBlockIdx&&!done;const isSwapped=isCur&&rot%2===1;const A=esc(String(ms[0].name||'').split(' ')[0]);const B=esc(String(ms[1].name||'').split(' ')[0]);const e0=esc(exs[i].name||'');const e1=esc(exs[i+1].name||'');
      body+=`<tr class="swaprow"><td colspan="${nSets+8}"><span style="font-size:13px"><b>${A}</b>: ${isSwapped?e1:e0} &nbsp;•&nbsp; <b>${B}</b>: ${isSwapped?e0:e1}</span>${isCur?` <span class="nowb">סט ${Math.floor((rot%4)/2)+1} מתוך 2</span> <button class="btn ghost sm" data-act="gRot" data-write style="margin-inline-start:10px">${rot%4<3?'🔄 החלפה':'➡ סופר סט הבא'}</button>`:''}</td></tr>`;
    }
  });
  return strip+`<div class="tbl-wrap"><table class="gtable ptab">${head}<tbody>${body}</tbody></table></div>`;
}

function introDocDefault(c,partner){if(partner){return `מפגש היכרות זוגי עם ${String(c.name||'').split(' ')[0]} ו${String(partner.name||'').split(' ')[0]}:\n🎯 מה הכי חשוב להם ולמה (כל אחד בנפרד): \n🔍 מה ראינו באימון (לכל אחד): \n📝 ההמלצה שלי: `}
  return `מפגש היכרות עם ${String(c.name||'').split(' ')[0]}${ageOf(c)?` (${ageOf(c)})`:''}:\n🎯 מה הכי חשוב ${c.sex==='F'?'לה':c.sex==='M'?'לו':'לו/לה'} ולמה: \n🔍 מה ראינו באימון: \n📝 ההמלצה שלי: `}
function clientKnownHtml(c,withName){
  const ag=ageOf(c);const rows=[];
  if(ag) rows.push({l:'גיל',v:String(ag)});
  if(c.goalsShort) rows.push({l:'מטרה',v:c.goalsShort});
  if(c.goalStart) rows.push({l:'נקודת פתיחה',v:c.goalStart});
  if(c.medHistory) rows.push({l:'רקע רפואי',v:c.medHistory});
  if(c.limits) rows.push({l:'מגבלות',v:c.limits});
  if(c.meds) rows.push({l:'תרופות',v:c.meds});
  if(!rows.length&&c.arboxNotes) rows.push({l:'הערות',v:c.arboxNotes.slice(0,300)});
  if(!rows.length) return '';
  const nm=withName?`<b style="display:block;margin-bottom:4px">${esc(String(c.name).split(' ')[0])}</b>`:'';
  return `<div style="margin-top:8px;padding:10px 12px;background:rgba(255,224,0,.18);border-radius:8px;font-size:15px;line-height:1.65">${nm}${rows.map(r=>`<span><b>${esc(r.l)}:</b> ${esc(r.v)}</span>`).join('<br>')}</div>`;
}

/* ----- progress report ----- */
function vReport(c){
  const done=doneSessions(S.P);
  const names=[...new Set(done.slice().reverse().flatMap(d=>(d.exercises||[]).filter(e=>exStats(e).done.length).map(e=>e.name)))];
  const rows=names.map(n=>{const h=exHistory(S.P,n);const f=h[0],l=h[h.length-1];const u=unitOf(l.ex);
    const unit=u==='kg'?'ק״ג':u==='sec'?'שנ׳':'חזרות';const ch=f.best?Math.round((l.best-f.best)/f.best*100):0;
    return {n,f:f.best,l:l.best,unit,ch,cnt:h.length}}).filter(r=>r.cnt>=2).sort((a,b)=>b.ch-a.ch);
  const first=done.length?done[done.length-1].date:c.startDate;
  const logo=($('.brand img')||{}).src||'';
  const top=rows[0];
  const chart=top?lineChart(exHistory(S.P,top.n).map(p=>({x:p.date,y:p.best})),{unit:top.unit==='ק״ג'?'kg':''}):'';
  return `<div class="rbar"><button class="btn primary" data-act="printReport">🖨 הדפסה / שמירה כ־PDF</button><button class="btn ghost" data-act="closeReport">→ חזרה לתיק</button></div>
  <div class="report"><div class="rhead"><div><div class="eyebrow">דוח התקדמות · ${new Date().toLocaleDateString('he-IL')}</div><h1>${esc(c.name)}</h1><div class="muted">מתאמן/ת בכוח מחודש מאז ${fmt(first)}</div></div>${logo?`<img src="${logo}" alt="כוח מחודש">`:''}</div>
  <div class="stats"><div class="stat"><b>${done.length}</b>אימונים</div><div class="stat"><b>${rows.filter(r=>r.ch>0).length}</b>תרגילים עם שיפור</div>${top&&top.ch>0?`<div class="stat"><b>+${top.ch}%</b>${esc(top.n)}</div>`:''}</div>
  ${chart?`<h3>${esc(top.n)} – לאורך הזמן</h3>${chart}`:''}
  ${rows.length?`<h3>מה השתפר</h3><table><thead><tr><th>תרגיל</th><th>בהתחלה</th><th>היום</th><th>שינוי</th></tr></thead><tbody>${rows.slice(0,10).map(r=>`<tr><td>${esc(r.n)}</td><td>${r.f} ${r.unit}</td><td><b>${r.l} ${r.unit}</b></td><td class="${r.ch>0?'up':''}">${r.ch>0?'+':''}${r.ch}%</td></tr>`).join('')}</tbody></table>`:'<p class="muted">אחרי כמה אימונים יופיעו כאן נתוני ההתקדמות.</p>'}
  ${(c.goalsShort||c.goalsLong)?`<div class="goalbox">${c.goalsShort?`<div><b>מטרות קרובות:</b> ${esc(c.goalsShort)}</div>`:''}${c.goalsLong?`<div><b>מטרת על:</b> ${esc(c.goalsLong)}</div>`:''}${c.goalStart?`<div><b>נקודת פתיחה (מפגש היכרות):</b> ${esc(c.goalStart)}</div>`:''}</div>`:''}
  <div class="foot">כוח מחודש · מחזירים את הכוח, בונים איכות חיים</div></div>`;
}

function prevPane(ctx,c,pane,pair){

  const head=pair?`<div class="pane-head"><h2>${esc(c.name)}</h2></div>`:'';
  if(!labels.length) return `<section data-pane="${pane}">${head}<div class="card empty"><strong>עדיין אין אימונים קודמים</strong><span>אחרי שמסיימים את האימון הראשון, הוא יופיע כאן עם כל התוצאות.</span></div></section>`;
  return `<section data-pane="${pane}">${head}${labels.map(l=>pastWeeks(ctx,c,l,curId,1,labels.length>1?'אימון '+l+' בשבוע':'')).join('')}</section>`;
}

   ${Object.entries(byCycle).map(([cy,ws])=>`<details class="arch"><summary><b>${esc(cy)}</b> · ${ws.length} אימונים</summary>

   </tbody></table></div>${w.note?`<div class="small muted">${esc(w.note)}</div>`:''}</div>`).join('')}</details>`).join('')}</div>`}

   </tbody></table></div></div>`).join('')}</div>`+archiveHtml(S.P);

/* ----- progress ----- */
function tProgress(c){
  const done=doneSessions(S.P);
  const names=[...new Set(done.slice().reverse().flatMap(d=>(d.exercises||[]).filter(e=>exStats(e).done.length).map(e=>e.name)))];

  const bestLbl=unit==='kg'?'משקל עבודה מקסימלי (ק"ג)':unit==='sec'?'זמן מקסימלי (שנ׳)':'מקסימום חזרות בסט';

}

   ${nm.length?`<div class="row small"><span class="muted">מהתוכנית:</span>${nm.slice(0,12).map(n=>`<button class="chip" type="button" data-tgpick="${esc(n)}">${esc(n)}</button>`).join('')}</div>`:''}

    ${S.newAssess?`<div class="form-grid"><label class="f" for="a_date">תאריך<input id="a_date" type="date" value="${today()}"></label>
      ${used.map(k=>`<label class="f" for="t_${k}">${esc(TESTS[k].n)} <span class="muted">(${esc(TESTS[k].u)})</span><input id="t_${k}" type="number" step="any" inputmode="decimal" data-test="${k}"></label>`).join('')}
      ${TG.filter(t=>!t.done).map(t=>`<label class="f">🎯 ${esc(t.n)} <span class="muted">(יעד: ${esc(t.goal||'')})</span><input data-tg="${esc(t.n)}" placeholder="${esc(tgLast(t.n)||'מה הצליח היום')}"></label>`).join('')}
      <label class="f" for="a_more">מבדק נוסף<select id="a_more"><option value="">בחירה…</option>${Object.keys(TESTS).filter(k=>!used.includes(k)).map(k=>`<option value="${k}">${esc(TESTS[k].n)}</option>`).join('')}</select></label></div>
      <label class="f" for="a_notes">הערות<textarea id="a_notes"></textarea></label>
      <div class="row"><button class="btn primary" data-act="saveAssess" data-write>שמירת המבדק</button><button class="btn ghost" data-act="cancelAssess">ביטול</button></div>`:''}</div>`;
  if(!list.length) return recHtml+`<div class="card empty"><strong>עוד לא נערך מבדק</strong><span>מבדק פתיחה נותן נקודת ייחוס. אחרי כל מבדק תקופתי (כל חודשיים) רואים כאן את השינוי.</span></div>`;
  const cols=list.slice(0,6);
  const rows=used.filter(k=>list.some(a=>num((a.values||{})[k])!=null)).map(k=>{const t=TESTS[k];
    const cells=cols.map((a,i)=>{const v=num((a.values||{})[k]);if(v==null) return '<td class="muted">—</td>';
      const prev=list.slice(i+1).map(x=>num((x.values||{})[k])).find(x=>x!=null);
      let d='';if(prev!=null&&t.b!=='none'&&v!==prev){const good=(v>prev)===(t.b==='up');d=` <span class="${good?'delta-up':'delta-down'} small" dir="ltr">${v>prev?'▲':'▼'}${+Math.abs(v-prev).toFixed(2)}</span>`}
      return `<td><b>${v}</b>${d}</td>`}).join('');
    const latest=list.map(a=>num((a.values||{})[k])).find(x=>x!=null);
    const fl=t.flag&&latest!=null?t.flag(latest,c):null;
    return `<tr class="clickrow" tabindex="0" data-atest="${k}"><td><b>${esc(t.n)}</b><div class="muted small">${esc(t.u)}</div></td>${cells}<td>${fl?`<span class="chip bad">${esc(fl)}</span>`:''}</td></tr>`}).join('');
  const tgRows=[...new Set(list.flatMap(a=>Object.keys(a.tg||{})))].map(n=>`<tr><td><b>🎯 ${esc(n)}</b></td>${cols.map(a=>`<td>${(a.tg||{})[n]?esc(a.tg[n]):'<span class="muted">—</span>'}</td>`).join('')}<td></td></tr>`).join('');
  if(!S.assTest||!used.includes(S.assTest)) S.assTest=used.find(k=>list.filter(a=>num((a.values||{})[k])!=null).length>=2)||used[0];
  const pts=list.slice().reverse().filter(a=>num((a.values||{})[S.assTest])!=null).map(a=>({x:a.date,y:num(a.values[S.assTest])}));
  return recHtml+`<div class="card"><h2>תוצאות מבדקים</h2><div class="tbl-wrap"><table class="tbl"><thead><tr><th>מבדק</th>${cols.map(a=>`<th>${fmt(a.date)}</th>`).join('')}<th>הערה</th></tr></thead><tbody>${tgRows}${rows}</tbody></table></div>
   ${list[0].notes?`<div class="muted small">הערות למבדק האחרון: ${esc(list[0].notes)}</div>`:''}</div>
   <div class="card"><h3>מגמה: ${esc(TESTS[S.assTest]?.n||'')}</h3>${lineChart(pts,{unit:TESTS[S.assTest]?.u||''})}<span class="muted small">לחצו על שורה בטבלה כדי להחליף מבדק.</span></div>`;
}

/* ---------- navigation ---------- */
function closeClient(){
  [S.P,S.Q].forEach(x=>{if(x&&x.unsub)x.unsub()}); if(S.assUnsub) S.assUnsub();
  S.P=null;S.Q=null;S.assUnsub=null;S.clientId=null;
}
function openClient(id,tab){
  if(S.G) closeGroup();
  closeClient();
  S.view='client'; S.clientId=id; S.tab=tab||'session'; S.assess=[]; S.progEx=null; S.assTest=null; S.newAssess=false; S.pairMode=false;
  S.P=mkCtx(id); subSessions(S.P);
  const c=clientById(id); if(c&&c.partnerId){S.Q=mkCtx(c.partnerId); subSessions(S.Q); S.pairMode=true;}
  S.assUnsub=S.db.collection('assessments').where('clientId','==',id).onSnapshot(snap=>{S.assess=snap.docs.map(d=>({id:d.id,...d.data()}));scheduleRender()},dbErr);
  render(); window.scrollTo(0,0);
}
function dbErr(e){ if(e&&e.code==='revoked'){S.db=null;S.offline=true;render()} else toast('טעינת הנתונים נכשלה – רעננו את הדף'); }

/* ---------- actions ---------- */
async function act(name,el){
  if(/^g[A-Z]/.test(name)) return gAct(name,el);
  if(/^tp[A-Z]/.test(name)) return tpAct(name,el);
  const c=client(); const ctx=ctxOf(el); const cc=ctx?clientById(ctx.clientId):null;
  switch(name){
  case 'backCoaches': closeClient(); S.view='coaches'; S.coachView=null; S.showNew=false; render(); window.scrollTo(0,0); break;
  case 'backCoach': {const k=S.coaches.some(x=>x.id===c?.coachId)?c.coachId:'none'; closeClient(); S.view='coaches'; S.coachView=k; S.showNew=false; render(); window.scrollTo(0,0); break;}
  case 'newClientGo': if(S.view==='client') closeClient(); S.view='clients'; S.showNew=true; render(); setTimeout(()=>$('#n_name')&&$('#n_name').focus(),0); break;
  case 'newClient': S.showNew=true; render(); setTimeout(()=>$('#n_name')&&$('#n_name').focus(),0); break;
  case 'cancelNew': S.showNew=false; render(); break;
  case 'createClient': {
    const name=$('#n_name').value.trim(); if(!name){toast('צריך להזין שם');return}
    const ttyp=$('#n_type').value; if(!ttyp){toast('בחרו: אימון אישי או זוגי');return}
    const isIntro=!!($('#n_intro')||{}).checked;
    const fq=Number($('#n_freq').value)||(isIntro?1:1);
    let partner=ttyp==='pair'?$('#n_partner').value:''; const pname=ttyp==='pair'&&partner==='__new'?$('#n_pname').value.trim():'';
    if(partner==='__new'&&!pname){toast('צריך להזין את שם בן/בת הזוג');return}
    const coachId=$('#n_coach').value,startDate=$('#n_start').value||today();
    const ref=S.db.collection('clients').doc(); const pref=partner==='__new'?S.db.collection('clients').doc():null; if(pref)partner=pref.id;
    const base={coachId,freq:fq,trainingType:ttyp,remote:ttyp==='remote',groupName:'',startDate,status:'active',goals:[],createdAt:Date.now(),hasPlan:false,pendingApproval:false};
    const ok=await saveDoc('clients/'+ref.id,{...base,name,partnerId:partner});
    if(ok){ if(pref) await saveDoc('clients/'+pref.id,{...base,name:pname,partnerId:ref.id}); else if(partner) await updClient(partner,{partnerId:ref.id,trainingType:'pair'});
      if(isIntro){const t=allTemplates().find(x=>x.id==='intro');const T0=Date.now();

  case 'tpGoHome': {S.tab='portal'; if(!c.portal) await tpPublish(c.id,true); render(); setTimeout(()=>{const h=[...document.querySelectorAll('#main h2, h2')].find(x=>/תרגילים לבית/.test(x.textContent)); if(h) h.scrollIntoView({behavior:'smooth',block:'start'})},300); break;}
  case 'tpPub': await tpPublish(c.id); break;
  case 'tpMsg': {const ta=document.getElementById('tpmsg'); const v=(ta&&ta.value||'').trim(); if(!v) break; const M=[...(c.portalMsgs||[]),{t:Date.now(),text:v}].slice(-150); c.portalMsgs=M; await updClient(c.id,{portalMsgs:M}); if(ta) ta.value=''; const ok=await tpPublish(c.id,true); toast(ok?'נשלח ✓':'ההודעה נשמרה, אבל הדף לא התעדכן. נסו "עדכון הדף"'); render(); setTimeout(()=>{const t=document.getElementById('tpthread');if(t)t.scrollTop=t.scrollHeight},50); break;}
  case 'tpCopy': try{await navigator.clipboard.writeText(tpLink(c));toast('הקישור הועתק')}catch(e){prompt('העתיקו את הקישור:',tpLink(c))} break;
  case 'tpRefresh': S.tpReps[c.id]=null; await tpLoad(c,true); break;
  case 'tpSeen': await updClient(c.id,{portalSeen:Math.floor(Date.now()/1000)}); S.tpNew[c.id]=0; render(); break;
  case 'tpAck': {const r=el.dataset.r, inp=document.querySelector(`.tpack[data-r="${CSS.escape(r)}"]`); const A={...(c.portalAck||{}),[r]:inp?inp.value.trim():''};
    await updClient(c.id,{portalAck:A}); c.portalAck=A; tpPublish(c.id,true); toast('המתאמן יראה שראיתם'); render(); break;}
  case 'tpOpenM': {const r=el.dataset.r,n=+el.dataset.n,t=el.dataset.t,box=document.getElementById('tpm_'+r); if(!box) return;
    if(S.tpUrls[r]){box.innerHTML=/^video/.test(t)?`<video controls playsinline src="${S.tpUrls[r]}" style="width:100%;max-width:520px;border-radius:12px;margin-top:6px"></video>`:`<img src="${S.tpUrls[r]}" style="width:100%;max-width:520px;border-radius:12px;margin-top:6px">`;return}
    box.innerHTML='<span class="muted small">טוען…</span>';
    try{const x=await tpCtx(c); const b=await PC.getBlob(x.k,n,pi=>tpPost('rmget',{s:x.s,w:x.w,r,i:pi}),t,f=>{box.innerHTML=`<span class="muted small">טוען… ${Math.round(f*100)}%</span>`}); S.tpUrls[r]=URL.createObjectURL(b); el.click();}catch(e){box.innerHTML='<span class="muted small">לא נטען. נסו שוב</span>'}
    break;}
  case 'tpImport': {const o=(S.tpReps[c.id]||[]).find(x=>x.r===el.dataset.r); if(!o) return; if(await tpImportLog(c,o)) toast('נוסף להיסטוריה ✓ (אימון עצמאי)'); break;}
  case 'tpVid': case 'tpHVid': tpPickFile(async f=>{
    if(f.size>300*1048576){toast('הקובץ גדול מדי (עד 300MB)');return}
    toast('מעלה… 0%');
    try{const m=await tpUpMedia(c,f,p=>toast('מעלה… '+Math.round(p*100)+'%'));
      if(name==='tpVid'){const V={...(c.exVideos||{}),[el.dataset.ex]:m};await updClient(c.id,{exVideos:V});c.exVideos=V}
      else{const H=tpHRead(c);H[+el.dataset.i].m=m;await updClient(c.id,{homeEx:H});c.homeEx=H}
      await tpPublish(c.id,true); toast('הסרטון עלה לדף של המתאמן ✓'); render();
    }catch(e){toast('ההעלאה נכשלה. בדקו אינטרנט ונסו שוב')}}); break;
  case 'tpVidDel': {const V={...(c.exVideos||{})};delete V[el.dataset.ex];await updClient(c.id,{exVideos:V});c.exVideos=V;tpPublish(c.id,true);render();break;}
  case 'tpHAdd': {const H=tpHRead(c);H.push({n:'',sets:'2',reps:'8-10',kg:'',note:'',unit:'bw'});await updClient(c.id,{homeEx:H});c.homeEx=H;render();setTimeout(()=>{const i=document.querySelector(`[data-th="${H.length-1}.n"]`);if(i){i.scrollIntoView({block:'center'});i.focus()}},200);break;}

  case 'tpRemote': {const v=!c.remote;await updClient(c.id,{remote:v});c.remote=v;await tpPublish(c.id);break;}
  case 'tpHSave': {const H=tpHRead(c);await updClient(c.id,{homeEx:H,portalOwner:S.meId||tpOwner(c)});c.homeEx=H;await tpPublish(c.id);break;}
  case 'tpOwn': await updClient(c.id,{portalOwner:S.meId}); toast('מעכשיו מה שהמתאמן שולח יגיע אליך'); render(); break;
  case 'tpDelAsk': S.tpConfirmDel=c.id; render(); break;
  case 'tpDelNo': S.tpConfirmDel=null; render(); break;
  case 'tpDel': {S.tpConfirmDel=null; try{const x=await tpCtx(c); await tpApi(x.s+'/del',{}); }catch(e){} await updClient(c.id,{portal:null,portalPub:null}); S.tpReps[c.id]=null; toast('הקישור בוטל'); render(); break;}
  }
}

async function boot(){
  refreshLib();
  bind(); render();
  const use=n=>(window.claude&&window.claude.use)?window.claude.use(n):Promise.resolve(null);
  const [db,user]=await Promise.all([use('db'),use('user')]);
  if(!db){S.offline=true;render();return}
  S.db=db; S.user=user; if(user&&user.coachId){S.meId=user.coachId;}
  if(user){const cw=await user.can('data.write'); if(cw===false) S.canWrite=false;}
  db.collection('coaches').onSnapshot(snap=>{S.coaches=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));const firstC=!S.loaded.c;S.loaded.c=true;scheduleRender()},dbErr);
  db.doc('settings/meta').onSnapshot(sn=>{S.meta=sn.exists?(sn.data()||{}):{};scheduleRender()},()=>{});
  db.doc('settings/templates').onSnapshot(sn=>{S.tpls=sn.exists?(sn.data()||{}):{};scheduleRender()},()=>{});
  db.doc('settings/cues').onSnapshot(sn=>{S.cues=sn.exists?(sn.data()||{}):{};scheduleRender()},()=>{});
  db.doc('settings/progression').onSnapshot(sn=>{if(sn.exists)S.settings={step:1,...sn.data()};scheduleRender()},()=>{});
  db.doc('settings/exercises').onSnapshot(sn=>{const d=sn.exists?(sn.data()||{}):{};S.exNames=d;S.exNamesRev={};Object.entries(d).forEach(([o,c])=>{if(c&&c!==o)S.exNamesRev[c]=o;});refreshLib();},()=>{});
  let linked=false;
  db.collection('clients').onSnapshot(snap=>{S.clients=snap.docs.map(d=>({id:d.id,...d.data()}));S.loaded.k=true;
    if(!S.tpPolled){S.tpPolled=1;setTimeout(()=>tpPoll(),4000)}
    const h=(location.hash||'').slice(1); if(!linked&&h&&S.clients.some(c=>c.id===h)){linked=true;openClient(h,'session');return}
    if(!linked){linked=true;let nv=null;try{nv=JSON.parse(localStorage.getItem('rs_nav')||'null')}catch(e){}
      if(nv&&nv.v==='client'&&nv.c&&S.clients.some(c=>c.id===nv.c)){openClient(nv.c,nv.t||'session');return}
      if(nv&&nv.v==='group'&&nv.g){try{openGroup(nv.g);return}catch(e){}}
      if(nv&&['coaches','manager','settings'].includes(nv.v)){S.view=nv.v;S.coachView=nv.cv??null;}}
    scheduleRender()},dbErr);
  render();
}
