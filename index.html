<title>מערכת כוח מחודש</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Suez+One&display=swap">
<style>body{margin:0}
/* Layout: sticky top bar + one working column (max 1240px). Client page = header strip, safety strip, tabs, work area. */
/* Brand: logo red #EA2328, orange #F68247, black. Black top band carries the logo; red marks actions and the active state. */
:root{
  --bg:#F6F4F3; --surface:#FFFFFF; --surface-2:#F8F3F2; --ink:#151313; --muted:#655C5B; --line:#E5DDDB;
  --accent:#EA2328; --accent-ink:#FFFFFF; --accent-soft:#FCE6E6; --accent-text:#C81A20;
  --brand-orange:#F68247; --band:#000000; --band-ink:#FFFFFF; --band-muted:#B9B0AE;
  --up:#1F7A4A; --up-soft:#E0F2E8; --warn:#A85C0C; --warn-soft:#FBEBDA; --bad:#B42318; --bad-soft:#F9E1DE; --info:#38598F; --info-soft:#E3EAF5;
  --chart2:#F68247;
  --f-display:"Suez One","Arial Hebrew",Georgia,serif;
  --f-body:"Rubik","Arial Hebrew",Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121010; --surface:#1B1817; --surface-2:#221E1D; --ink:#F2EDEC; --muted:#A99F9D; --line:#36302F;
  --accent:#EF3B40; --accent-ink:#FFFFFF; --accent-soft:#3B1A1B; --accent-text:#FF7A7E;
  --brand-orange:#F68247; --band:#000000; --band-ink:#FFFFFF; --band-muted:#A99F9D;
  --up:#5CC98C; --up-soft:#173527; --warn:#F0A55A; --warn-soft:#3A2A16; --bad:#FF8A80; --bad-soft:#3F1E1C; --info:#8DAAE0; --info-soft:#1E2A40;
  --chart2:#F68247; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#121010; --surface:#1B1817; --surface-2:#221E1D; --ink:#F2EDEC; --muted:#A99F9D; --line:#36302F;
  --accent:#EF3B40; --accent-ink:#FFFFFF; --accent-soft:#3B1A1B; --accent-text:#FF7A7E;
  --brand-orange:#F68247; --band:#000000; --band-ink:#FFFFFF; --band-muted:#A99F9D;
  --up:#5CC98C; --up-soft:#173527; --warn:#F0A55A; --warn-soft:#3A2A16; --bad:#FF8A80; --bad-soft:#3F1E1C; --info:#8DAAE0; --info-soft:#1E2A40;
  --chart2:#F68247; color-scheme:dark;}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
*{box-sizing:border-box}
.app{direction:rtl;min-height:100%}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--band);color:var(--band-ink);border-bottom:3px solid var(--accent)}
.top-in{max-width:1480px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;flex-direction:column;align-items:center;gap:6px;white-space:nowrap;text-align:center}
.brand .wm{align-items:center}
.navcol{display:flex;flex-direction:column;align-items:center;gap:10px;margin-inline:auto}
.subrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.subrow:empty{display:none}
.brand img{height:72px;width:auto;display:block}
.brand .wm{display:flex;flex-direction:column;line-height:1.05}
.brand .name{font-family:var(--f-display);font-size:30px;color:var(--band-ink)}
.brand .name span{color:var(--accent)}
.brand .slogan{font-size:14px;color:var(--band-muted);margin-top:4px}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{border:0;background:transparent;color:var(--band-muted);font:inherit;font-weight:600;padding:7px 12px;border-radius:8px;cursor:pointer}
.nav button[aria-current="true"]{background:var(--accent);color:#fff}
.nav button:hover{color:var(--band-ink)}
.top-side{margin-inline-start:auto;display:grid;grid-template-columns:auto auto;align-items:center;justify-items:end;gap:8px 10px}
.top-side .who{grid-column:1 / -1;margin-top:18px}
.save-state{font-size:12px;color:var(--band-muted);min-width:64px}
.wrap{max-width:1480px;margin:0 auto;padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:400;font-size:36px;line-height:1.2}
h2{font-size:18px;font-weight:700}
h3{font-size:15px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:15px}
.eyebrow{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card > * + *{margin-top:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px}
.grid2 > *{min-width:0}
.btn{font:inherit;font-weight:600;font-size:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.sm{padding:5px 11px;font-size:15px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.nav button:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.clickrow:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0}
textarea{width:100%;min-height:70px;resize:vertical}
input[type=number]{font-variant-numeric:tabular-nums}
label.f{display:flex;flex-direction:column;gap:4px;font-size:15px;font-weight:600;color:var(--muted)}
label.f > input,label.f > select,label.f > textarea{font-weight:400;color:var(--ink)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.up{background:var(--up-soft);color:var(--up);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent-text);border-color:transparent}
button.chip{cursor:pointer;font-family:inherit}
button.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:13px;color:var(--muted)}
.kpi.bad b{color:var(--bad)} .kpi.warn b{color:var(--warn)} .kpi.up b{color:var(--up)} .kpi.info b{color:var(--info)}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:16px;font-variant-numeric:tabular-nums}
.tbl th{text-align:start;font-size:14px;font-weight:600;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.clickrow{cursor:pointer}
.clickrow:hover td{background:var(--surface-2)}
.banner{border-radius:var(--r);padding:14px 18px;font-size:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner.info{background:var(--info-soft);color:var(--info)}
.banner.acc{background:var(--accent-soft);color:var(--accent-text)}
.banner b{font-weight:700}
.empty{padding:34px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty strong{color:var(--ink);font-size:16px}
/* client page */
.chead{display:flex;gap:18px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.chead .meta{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:16px;color:var(--muted)}
.chead .meta b{color:var(--ink);font-weight:600}
.safety{border:1px solid var(--bad-soft);background:var(--bad-soft);color:var(--ink);border-radius:var(--r);padding:12px 16px;font-size:17px;display:flex;gap:8px;align-items:baseline}
.safety b{color:var(--bad);white-space:nowrap}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:transparent;font:inherit;font-size:18px;font-weight:600;color:var(--muted);padding:10px 14px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent-text);border-bottom-color:var(--accent)}
/* session editor */
.sess-head{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.labels{display:flex;gap:6px;flex-wrap:wrap}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ex-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.ex-num{font-family:var(--f-display);font-size:20px;color:var(--accent-text);width:26px;text-align:center}
.ex-name{flex:1 1 220px;font-weight:700;font-size:15px}
.ex-body{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;padding:14px}
@media (max-width:820px){.ex-body{grid-template-columns:1fr}}
.targets{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.targets label.f{width:96px}
.targets .range{display:flex;gap:4px;align-items:center}
.targets .range input{width:52px}
.sets{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.sets th{font-size:12px;color:var(--muted);font-weight:600;text-align:start;padding:4px 6px}
.sets td{padding:3px 6px}
.sets input{width:100%;max-width:110px;font-size:16px;font-weight:600;text-align:center;padding:7px 6px}
.sets tr[data-st="top"] .dot{background:var(--up)}
.sets tr[data-st="in"] .dot{background:var(--info)}
.sets tr[data-st="low"] .dot{background:var(--warn)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--line)}
.prev{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:8px 10px;font-variant-numeric:tabular-nums}
.prev b{color:var(--ink);font-weight:600}
.sugg{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:8px 10px;border-radius:8px}
.sugg .arr{font-weight:700;font-size:15px;line-height:1.2}
.sugg.up{background:var(--up-soft);color:var(--up)}
.sugg.reps,.sugg.same{background:var(--info-soft);color:var(--info)}
.sugg.down,.sugg.stall{background:var(--warn-soft);color:var(--warn)}
.sugg.flag{background:var(--bad-soft);color:var(--bad)}
.ex-side{display:flex;flex-direction:column;gap:10px}
.ex-side .row label.f{width:90px}
.sess-foot{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;position:sticky;bottom:0;background:var(--bg);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
/* history */
.hist{display:flex;flex-direction:column;gap:12px}
.hist .tbl td:first-child{font-weight:600}
/* charts */
.chart{width:100%;height:auto;direction:ltr;display:block}
.chart text{font-family:var(--f-body);font-size:11px;fill:var(--muted)}
.chart .last{font-size:12px;font-weight:700;fill:var(--ink)}
.chart-empty{padding:30px 10px;text-align:center;color:var(--muted);font-size:14px;background:var(--surface-2);border-radius:8px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-inline-end:5px}
.delta-up{color:var(--up);font-weight:600}
.delta-down{color:var(--bad);font-weight:600}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:20;direction:rtl;max-width:calc(100% - 32px)}
.coach-pick{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--band-muted)}
.coach-pick select{background:#2A2625;color:#fff;border-color:#4A4342}
.coach-pick select{padding:5px 8px}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.tab{transition:background .15s,color .15s,border-color .15s}}
@media (max-width:560px){h1{font-size:23px}.kpi b{font-size:24px}.top-side{margin-inline-start:0}}
.ss-group{border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:10px}
.ss-head{font-weight:700;color:var(--accent-text);padding:2px 6px}
.pairgrid{display:grid;grid-template-columns:1fr;gap:36px;align-items:start}
.pairgrid > section{min-width:0}
.pairgrid .ex-body{grid-template-columns:1fr}
.pairgrid .sess-foot{position:static;background:transparent}
section[data-pane]{display:flex;flex-direction:column;gap:14px}
.pane-head{display:flex;flex-direction:column;gap:8px;padding-bottom:8px;border-bottom:2px solid var(--accent)}
.f.fake{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
label.f.inline{flex-direction:row;align-items:center;gap:6px}

  started=true;
  resolveUser({coachId:st.coachId,role:st.role||'coach',email,can:async()=>true,canEdit:async()=>st.role==='admin',isOwner:async()=>st.role==='admin',id:()=>u.uid,me:async()=>({id:u.uid,email,name:u.displayName||''})});

}

onAuthStateChanged(auth,u=>{

});

};

/* ---------- writes: one at a time per document ---------- */
const writers = {};
function saveDoc(path,data,{merge=false,delay=0}={}){
  if(!S.db||!S.canWrite) return Promise.resolve(false);
  const w = writers[path] || (writers[path]={pending:null,running:null,timer:null,waiters:[]});
  if(merge && w.pending && w.pending.merge) Object.assign(w.pending.data,clone(data)); else w.pending={data:clone(data),merge};
  clearTimeout(w.timer);
  setSave('pending');
  return new Promise(res=>{w.waiters.push(res);w.timer=setTimeout(()=>flush(path),delay)});
}
async function flush(path){
  const w=writers[path]; if(!w) return;
  if(w.running){ await w.running; }
  if(!w.pending) return;
  const p=w.pending; w.pending=null; const waiters=w.waiters.splice(0);
  setSave('saving');
  let ok=true;
  w.running=(p.merge?S.db.doc(path).update(p.data):S.db.doc(path).set(p.data))
    .catch(e=>{ok=false;onWriteError(e)})
    .finally(()=>{w.running=null});
  await w.running;
  waiters.forEach(r=>r(ok));
  if(w.pending) flush(path); else setSave(ok?'saved':'error');
}
function hasPending(path){const w=writers[path];return !!(w&&(w.pending||w.running))}
function onWriteError(e){
  if(e&&e.code==='invalid_argument'){S.canWrite=false;toast('אין לכם הרשאת עריכה בדף הזה – השינויים לא נשמרו');render();return}
  if(e&&e.code==='quota_exceeded'){toast('מאגר הנתונים מלא – פנו לירין');return}
  toast('השמירה נכשלה – בדקו חיבור ונסו שוב');
}
let saveT;
function setSave(st){const el=$('#saveState');clearTimeout(saveT);
  el.textContent=st==='saving'||st==='pending'?'שומר…':st==='saved'?'נשמר ✓':st==='error'?'שגיאה בשמירה':'';
  if(st==='saved') saveT=setTimeout(()=>el.textContent='',2500);}
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3400)}

/* ---------- progression engine (double progression + RIR) ---------- */
function unitOf(ex){return ex.unit==='kg'&&num(ex.targetKg)==null&&!(ex.sets||[]).some(s=>num(s.kg)>0)?'bw':ex.unit}
function stepFor(group,kg){ const st=S.settings||{}; return group==='lower'?(num(st.lower)??1):(num(st.upper)??0.5); }
function exStats(ex){
  const done=(ex.sets||[]).filter(s=>num(s.reps)!=null);
  const reps=done.map(s=>num(s.reps));
  const kgs=done.map(s=>num(s.kg)??num(ex.targetKg)??0);
  const u=unitOf(ex);
  const best = u==='kg' ? Math.max(0,...kgs) : Math.max(0,...reps);
  const vol = u==='kg' ? done.reduce((a,s,i)=>a+kgs[i]*reps[i],0) : reps.reduce((a,b)=>a+b,0);
  return {done,reps,kgs,best,vol};
}
function suggest(ex,hist){
  const min=num(ex.repMin)??6, max=num(ex.repMax)??10, sets=num(ex.targetSets)||2, pain=num(ex.pain), rir=num(ex.rir), rirT=num(ex.rirTarget)??3;
  const st=exStats(ex); const base={sets,repMin:min,repMax:max,kg:num(ex.targetKg)};
  if(!st.done.length) return {...base,type:'same',reason:'לא נרשמו תוצאות – התוכנית נשארת כמו שהייתה'};
  if(pain!=null&&pain>=4) return {...base,type:'flag',reason:`דווח כאב ${pain}/10 – לא להתקדם. לבדוק טכניקה, טווח תנועה או החלפת תרגיל`};
  const allTop=st.reps.every(r=>r>=max)&&st.done.length>=sets;
  const allIn=st.reps.every(r=>r>=min);
  const badMiss=st.reps.some(r=>r<=min-2);
  let s;
  const u=unitOf(ex);
  if(u==='kg'){
    const work=Math.min(...st.kgs);
    const tooHard=rir!=null&&rir<2;
    if(allTop&&tooHard){s={...base,kg:work,type:'stall',reason:`הגיע ל-${max} חזרות אבל קרוב מדי לכשל (RIR ${rir}, המינימום 2) – נשארים על ${work} ק"ג עד שזה עובר ב-RIR 2–3`};}
    else if(!allIn&&tooHard){const nk=Math.max(0,r05(work*0.9));s={...base,kg:nk,type:'down',reason:`מתחת לטווח וקרוב לכשל (RIR ${rir}) ← הורדה של כ-10% ל-${nk} ק"ג`};}
    else if(tooHard){s={...base,kg:work,type:'stall',reason:`בתוך הטווח אבל RIR ${rir} – קרוב מדי לכשל. אותו משקל, לשמור על רזרבה של 2–3 חזרות`};}
    else if(allTop){const inc=stepFor(ex.group,work)*(rir!=null&&rir>=Math.max(5,rirT+2)?2:1);s={...base,kg:r05(work+inc),type:'up',reason:`כל הסטים הגיעו ל-${max} חזרות${rir!=null&&rir>=Math.max(5,rirT+2)?` עם רזרבה גבוהה (RIR ${rir})`:''} ← +${inc} ק"ג`};}
    else if(badMiss){const nk=Math.max(0,r05(work*0.9));s={...base,kg:nk,type:'down',reason:`סט אחד או יותר רחוק מתחתית הטווח (${min}) ← הורדה של כ-10% ל-${nk} ק"ג`};}
    else if(allIn){s={...base,kg:work,type:'reps',reason:`בתוך הטווח – אותו משקל (${work} ק"ג), לשאוף לחזרה נוספת בכל סט`};}
    else {s={...base,kg:work,type:'same',reason:'חלק מהסטים מתחת לטווח – חוזרים על אותו משקל'};}
  } else if(u==='sec'){
    if(allTop) s={...base,repMin:min+5,repMax:max+5,type:'up',reason:`הוחזק ${max} שנ׳ בכל הסטים ← יעד חדש ${min+5}–${max+5} שנ׳`};
    else s={...base,type:allIn?'reps':'same',reason:allIn?'בתוך הטווח – להאריך מעט בכל סט':'לא הגיע לזמן היעד – אותו יעד'};
  } else {
    if(allTop){ if(sets<4) s={...base,sets:sets+1,type:'up',reason:`השלים ${max} חזרות בכל הסטים ← סט נוסף (${sets+1} סטים)`};
      else s={...base,repMin:min+2,repMax:max+2,type:'up',reason:`השלים את הטווח ← יעד חזרות ${min+2}–${max+2}, או מעבר לגרסה קשה יותר`}; }
    else s={...base,type:allIn?'reps':'same',reason:allIn?'בתוך הטווח – לשאוף לחזרה נוספת':'מתחת לטווח – אותו יעד'};
  }
  if(s.type!=='up'&&s.type!=='flag'&&hist&&hist.length>=3){
    const last=hist.slice(-3).map(h=>h.best);
    if(last.every(v=>v===last[0])) {s.type='stall';s.reason+=' · ללא התקדמות 3 אימונים ברצף – לשקול שינוי גירוי (טמפו, וריאציה, נפח)';}
  }
  return s;
}

/* ---------- session data per client context ---------- */
function doneSessions(ctx){return ctx.sessions.filter(s=>s.status==='done').sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.completedAt||0)-(a.completedAt||0))}
function plannedSessions(ctx){return ctx.sessions.filter(s=>s.status==='planned').sort((a,b)=>String(a.label).localeCompare(String(b.label)))}
function exHistory(ctx,name,upTo){
  const out=[];
  doneSessions(ctx).slice().reverse().forEach(d=>{ if(upTo&&d.date>upTo) return; (d.exercises||[]).forEach(e=>{ if(e.name===name){const st=exStats(e); if(st.done.length) out.push({date:d.date,best:st.best,vol:st.vol,unit:e.unit,ex:e,sid:d.id});}}); });
  return out;
}
function isUnilateral(name){return /מכרע|לאנצ|לאנג|בולגרי|ברגל אחת|ביד אחת|עלייה על מדרגה|סטפ אפ|סינגל|חד.צדדי|רגל אחת|יד אחת/.test(String(name||''))}
function carry(ex){return {name:ex.name,unit:ex.unit,group:ex.group||'other',ss:ex.ss||'',rirTarget:ex.rirTarget??3,tempo:ex.tempo||''}}
function buildNext(ctx,d,docId){
  const exercises=(d.exercises||[]).filter(e=>e.name).map(ex=>{
    const s=suggest(ex,exHistory(ctx,ex.name,d.date));
    const base={targetSets:num(ex.targetSets)||2,targetKg:ex.targetKg,repMin:num(ex.repMin)??6,repMax:num(ex.repMax)??10};
    let rec='';
    if(s.type==='up'){ const u=unitOf(ex); rec=u==='kg'?'kg':(s.sets>base.targetSets?'sets':'reps'); }
    let text=s.reason; const st=exStats(ex); const topRep=st.reps.length?Math.max(...st.reps):0;
    if(unitOf(ex)!=='sec'&&s.type!=='flag'&&(topRep>12||base.repMax>12)){rec='kg';text=`עבר 12 חזרות – לשאוף להוסיף משקל עבודה ולחזור לטווח חזרות נמוך יותר`;}
    if(isUnilateral(ex.name)&&s.type!=='flag'){ if(topRep>=8||base.repMax>8){rec='kg';} text=`תרגיל חד־צדדי: להגביל את הטווח עד 8 חזרות ולהתקדם במשקל עבודה – בתרגילים כאלה הדופק מעייף לפני השריר`+(s.type==='down'?` · ${s.reason}`:''); }
    return {id:uid(),...carry(ex),...base,base,prog:[],rec,
      sets:Array.from({length:base.targetSets},()=>({kg:'',reps:''})),rir:'',pain:'',note:'',sugg:{type:s.type,text}};
  });
  return {clientId:d.clientId,label:d.label||'1',programNo:d.programNo||1,seq:(Number(d.seq)||1)+1,status:'planned',approved:true,date:'',coach:'',notes:'',warmup:d.warmup||'',exercises,basedOn:docId,createdAt:Date.now()};
}
const PROGS=[['kg','משקל עבודה'],['reps','חזרות'],['sets','סטים'],['tempo','טמפו'],['rom','טווח תנועה'],['harder','מנח קשה יותר']];
const PNOTE={tempo:'טמפו: 2 שנ׳ בלימה, שנייה עצירה בחלק הקשה',rom:'טווח תנועה גדול יותר',harder:'מנח קשה יותר (למשל: לעמוד קדימה יותר ב־TRX, להוריד את המדרגה)'};
function applyNotes(ex){let lines=String(ex.tempo||'').split('\n').filter(l=>!Object.values(PNOTE).includes(l.trim()));
  ['tempo','rom','harder'].forEach(k=>{if((ex.prog||[]).includes(k))lines.push(PNOTE[k])}); ex.tempo=lines.filter((l,i)=>l.trim()||i<lines.length-1).join('\n').replace(/^\n+/,'')}
function progLabel(ex,k){const b=ex.base||{};if(k==='kg')return `משקל +${stepFor(ex.group,num(b.targetKg)||0)} ק"ג`;if(k==='reps')return 'חזרות +1';if(k==='sets')return 'סט נוסף';if(k==='tempo')return 'טמפו';if(k==='harder')return 'מנח קשה יותר';return 'טווח תנועה'}
function applyProg(ex){const b=ex.base;if(!b)return;const has=k=>(ex.prog||[]).includes(k);
  ex.targetKg=has('kg')?r05((num(b.targetKg)||0)+stepFor(ex.group,num(b.targetKg)||0)):b.targetKg;
  ex.repMin=b.repMin+(has('reps')?1:0); ex.repMax=b.repMax+(has('reps')?1:0);
  ex.targetSets=b.targetSets+(has('sets')?1:0);
  applyNotes(ex);
  while(ex.sets.length<ex.targetSets)ex.sets.push({kg:'',reps:''});while(ex.sets.length>ex.targetSets&&num(ex.sets[ex.sets.length-1].reps)==null)ex.sets.pop();}
function templateExercises(mode){return mode==='single'?[1,2,3,4,5,6].map(()=>({...newExercise(),ss:''})):[1,1,2,2,3,3].map(k=>({...newExercise(),ss:String(k)}))}
function blankPlan(clientId,label,mode){return {clientId,label:label||'1',seq:1,status:'planned',approved:true,date:'',coach:'',notes:'',warmup:'',exercises:templateExercises(mode),createdAt:Date.now()}}
function newExercise(){return {id:uid(),name:'',unit:'kg',group:'other',ss:'',rirTarget:3,tempo:'',targetSets:2,targetKg:'',repMin:6,repMax:10,sets:[{kg:'',reps:''},{kg:'',reps:''}],rir:'',pain:'',note:'',sugg:null}}
function subSessions(ctx){

function saveEdit(ctx,delay=600){ if(!ctx||!ctx.edit) return Promise.resolve(false); if(ctx.edit.fresh){ctx.edit.fresh=false;ctx.edit.local=true;document.querySelectorAll('.fresh-banner').forEach(e=>e.remove());updClient(ctx.clientId,{hasPlan:true});} const data=clone(ctx.edit.doc); delete data.id; return saveDoc('sessions/'+ctx.edit.id,data,{delay}); }

function assessDue(c){ if(c.lastAssessmentDate) return daysSince(c.lastAssessmentDate)>90; return daysSince(c.startDate||isoOf(c.createdAt))>14; }
function clientFlags(c){
  const f=[];
  if(c.pendingApproval) f.push(['warn','תוכנית ממתינה לאישור']);
  else if(!c.hasPlan) f.push(['warn','אין אימון מתוכנן']);
  if(!c.lastSessionDate){ if(daysSince(c.startDate||isoOf(c.createdAt))>7) f.push(['bad','טרם נרשמו תוצאות']); }
  else if(daysSince(c.lastSessionDate)>14) f.push(['bad',`לא עודכן ${daysSince(c.lastSessionDate)} ימים`]);
  if(c.painDate&&daysSince(c.painDate)<=14) f.push(['bad','דווח כאב 4+']);
  if(assessDue(c)) f.push(['info',c.lastAssessmentDate?'מבדק תקופתי באיחור':'חסר מבדק פתיחה']);
  return f;
}
function activeClients(){return S.clients.filter(c=>(c.status||'active')==='active')}
function client(){return clientById(S.clientId)}
function partnerOf(c){return c&&c.partnerId?clientById(c.partnerId):null}
function recTests(c){const set=new Set(CORE_TESTS);(c.goals||[]).forEach(g=>(GOAL_TESTS[g]||[]).forEach(t=>set.add(t)));return [...set]}
function stale(c){return c.lastSessionDate?daysSince(c.lastSessionDate)>14:daysSince(c.startDate||isoOf(c.createdAt))>7}

/* ---------- charts ---------- */
function niceStep(raw){const p=Math.pow(10,Math.floor(Math.log10(raw||1)));const f=raw/p;return (f<1.5?1:f<3?2:f<7?5:10)*p}
function lineChart(pts,{color='var(--accent)',unit=''}={}){
  if(pts.length<2) return `<div class="chart-empty">צריך לפחות שתי מדידות כדי להציג מגמה</div>`;
  const W=560,H=210,pl=46,pr=60,pt=18,pb=30;
  const xs=pts.map(p=>Date.parse(p.x)), ys=pts.map(p=>p.y);
  let x0=Math.min(...xs),x1=Math.max(...xs); if(x0===x1){x0-=864e5;x1+=864e5}
  let y0=Math.min(...ys),y1=Math.max(...ys); if(y0===y1){y0-=1;y1+=1}
  const step=niceStep((y1-y0)/4); y0=Math.floor(y0/step)*step; y1=Math.ceil(y1/step)*step;
  const X=x=>pl+(x-x0)/(x1-x0)*(W-pl-pr), Y=y=>pt+(1-(y-y0)/(y1-y0))*(H-pt-pb);
  let g='';
  for(let v=y0; v<=y1+1e-9; v+=step){const yy=Y(v).toFixed(1);g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${pl-8}" y="${+yy+4}" text-anchor="end">${+v.toFixed(2)}</text>`}
  const idx=[0,Math.floor((pts.length-1)/2),pts.length-1].filter((v,i,a)=>a.indexOf(v)===i);
  idx.forEach(i=>{g+=`<text x="${X(xs[i]).toFixed(1)}" y="${H-8}" text-anchor="middle">${fmt(pts[i].x)}</text>`});
  const line=pts.map((p,i)=>`${i?'L':'M'}${X(xs[i]).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
  const area=`${line}L${X(xs[xs.length-1]).toFixed(1)},${Y(y0)}L${X(xs[0]).toFixed(1)},${Y(y0)}Z`;
  const dots=pts.map((p,i)=>`<circle cx="${X(xs[i]).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${i===pts.length-1?5:3}" fill="${i===pts.length-1?color:'var(--surface)'}" stroke="${color}" stroke-width="2"/>`).join('');
  const L=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="גרף מגמה">${g}<path d="${area}" fill="${color}" fill-opacity=".10"/><path d="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>${dots}<text class="last" x="${(X(xs[xs.length-1])+9).toFixed(1)}" y="${(Y(L.y)+4).toFixed(1)}">${+L.y.toFixed(2)}${unit?' '+esc(unit):''}</text></svg>`;
}

function vDashboard(){
  if(!S.loaded.k) return `<div class="empty"><strong>טוען מתאמנים…</strong></div>`;
  const act=activeClients();
  const d=new Date();
  const head=`<div class="spread"><div><div class="eyebrow">${d.toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div><h1>לוח בקרה</h1></div>

async function pinHash(id,pin){const txt='rs-pin:'+id+':'+pin;
  try{if(crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}
  let h=5381;for(const ch of txt)h=((h*33)^ch.charCodeAt(0))>>>0;return 'd'+h.toString(16)}
const MGR=['yarin','shaked'];
function renderWho(){const w=$('#who'),m=$('#navMine');if(!w)return;const k=S.meId&&S.coaches.find(x=>x.id===S.meId);
  if(m)m.hidden=!k; const mg=$('#navMgr'); if(mg)mg.hidden=!(k&&MGR.includes(k.id)); const gs=$('#gsearch'); if(gs)gs.hidden=!k; const nv=$('#nav'); if(nv)nv.style.visibility=(S.db&&!k)?'hidden':''; if(!k){w.hidden=true;w.textContent='';return}
  w.hidden=false;w.innerHTML='';const sp=document.createElement('span');sp.textContent='שלום, '+k.name;w.append(sp)}
function gMatches(q){q=q.trim(); if(!q) return [];
  const mine=S.meId;
  return S.clients.filter(c=>String(c.name||'').includes(q)).sort((a,b)=>((a.status||'active')==='active'?0:1)-((b.status||'active')==='active'?0:1)||(a.coachId===mine?0:1)-(b.coachId===mine?0:1)||String(a.name).localeCompare(String(b.name),'he')).slice(0,12)}
function gRender(){const box=$('#gres'),q=$('#gq').value; if(!q.trim()){box.hidden=true;return}
  const m=gMatches(q); S.gSel=Math.min(S.gSel||0,Math.max(m.length-1,0)); box.hidden=false; box.innerHTML='';
  if(!m.length){const d=document.createElement('div');d.className='none';d.textContent='לא נמצא מתאמן בשם הזה';box.append(d);return}
  m.forEach((c,i)=>{const b=document.createElement('button');b.type='button';b.dataset.gid=c.id;if(i===S.gSel)b.className='on';
    const n=document.createElement('span');n.textContent=c.name+((c.status||'active')!=='active'?(c.status==='paused'?' (בהקפאה)':' (בארכיון)'):'');
    const k=document.createElement('span');k.className='gc';k.textContent=coachName(c.coachId);b.append(n,k);box.append(b)})}
function gOpen(id){const q=$('#gq');q.value='';$('#gres').hidden=true;q.blur();S.showNew=false;openClient(id);window.scrollTo(0,0)}
function bindSearch(){const q=$('#gq'),box=$('#gres');
  q.addEventListener('input',()=>{S.gSel=0;gRender()});
  q.addEventListener('focus',()=>gRender());
  q.addEventListener('keydown',e=>{const m=gMatches(q.value);
    if(e.key==='ArrowDown'){e.preventDefault();S.gSel=Math.min((S.gSel||0)+1,m.length-1);gRender()}
    else if(e.key==='ArrowUp'){e.preventDefault();S.gSel=Math.max((S.gSel||0)-1,0);gRender()}
    else if(e.key==='Enter'){e.preventDefault();if(m[S.gSel||0])gOpen(m[S.gSel||0].id)}
    else if(e.key==='Escape'){q.value='';box.hidden=true;q.blur()}});
  box.addEventListener('mousedown',e=>{const b=e.target.closest('[data-gid]');if(b){e.preventDefault();gOpen(b.dataset.gid)}});
  document.addEventListener('mousedown',e=>{if(!e.target.closest('#gsearch'))box.hidden=true});
  document.addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||'')&&!$('#gsearch').hidden){e.preventDefault();q.focus()}});
}

  const npBtn=isDone?'':ctx.newProg?`<span class="row small"><span class="muted">תוכנית חדשה במקום שבוע ${d.seq}:</span><button class="btn sm" data-act="newProgram" data-mode="ss" data-write>חדשה – סופר סטים</button><button class="btn sm" data-act="newProgram" data-mode="single" data-write>חדשה – סטים רגילים</button><button class="btn sm" data-act="newProgram" data-mode="copy" data-write>העתקת התרגילים הנוכחיים</button><button class="btn ghost sm" data-act="cancelNewProg">ביטול</button></span>`:`<button class="btn sm" data-act="askNewProg" data-write>+ פתיחת תוכנית אימונים חדשה</button>`;

  const weekChip=`<div class="weekchip">${(d.programNo||1)>1?`תוכנית ${d.programNo} · `:''}שבוע ${d.seq}${isDone?` · בוצע ${fmt(d.date)}`:''}</div>`;
  return `<section data-pane="${pane}">${ph}${labelsBar}${weekChip}${painHtml}<label class="f warmup">חימום <span class="muted small">(נשמר קבוע)</span><textarea data-f="client.warmup" rows="2" placeholder="למשל: סיבובי כתפיים, מעברים בסמית', ברכיים לחזה, עקבים לישבן">${esc(c.warmup!=null?c.warmup:(d.warmup||''))}</textarea></label>${list}<div class="row"><button class="btn" data-act="addSS" data-write>+ הוספת סופר סט</button><button class="btn" data-act="addEx" data-write>+ תרגיל בודד</button></div>

function tSession(c){

  if(S.pairMode&&p&&S.Q) return toggle+`<div class="pairgrid">${paneHtml(S.P,c,0,true)}${paneHtml(S.Q,p,1,true)}</div>`;

/* ----- cues & substitutes ----- */
function cueHtml(name){const c=name&&S.cues&&S.cues[name]; if(!c||(!c.t&&!c.v)) return '';
  const v=c.v&&/^https?:\/\//.test(c.v)?`<a href="${esc(c.v)}" target="_blank" rel="noopener">🎬 סרטון</a>`:'';
  return `<div class="cue">💡 ${esc(c.t||'')}${v}</div>`}
const PATS=[['single',/בולגרי|מכרע|לאנג|סטפ אפ|סינגל לג|עלייה וירידה ממדרגה/],['squat',/סקוואט|קום-שב/],['hinge',/דדליפט|היפ תראסט|גלוט ברידג|פשיטת ירך|סווינג/],['calf',/קאף רייז/],['knee',/כפיפת ברכיים|קלאם/],
 ['hpush',/לחיצת חזה|שכיבות סמיכה|פליי/],['vpush',/לחיצת כתפיים/],['hpull',/חתירה|פייס פול/],['vpull',/משיכה מפולי עליון|צ'ין אפס/],['rotcuff',/סיבוב חיצוני|סיבוב פנימי|הרחקת כתפיים/],
 ['biceps',/כפיפת מרפקים/],['triceps',/פשיטת מרפקים|סקאל קראשר/],['carry',/פארמר ווק|סוטקייס/],['core',/פלאנק|פאלוף|וודצ'ופ|קראנץ'|דד באג|בירד דוג|טאק אפס|הרמת רגליים/],['balance',/עמידה על רגל|עמידת טנדם|הליכת טנדם|מונסטר ווק|הליכה לאחור/]];
function patOf(n){n=String(n||'');const p=PATS.find(x=>x[1].test(n));return p?p[0]:null}
function subsFor(name){const p=patOf(name); if(!p){const l=libFind(name);return l?LIB.filter(x=>x[2]===l[2]&&x[0]!==name).slice(0,8).map(x=>x[0]):[]}
  return LIB.filter(x=>x[0]!==name&&patOf(x[0])===p).map(x=>x[0]).slice(0,10)}
function swapRow(ex,i,nSets){const subs=subsFor(ex.name);
  return `<tr class="swaprow" data-ex="${i}"><td colspan="${nSets+7}"><b>תרגילים חלופיים ל${esc(ex.name)}:</b> ${subs.length?subs.map(n=>`<button class="chip" data-act="swapTo" data-name="${esc(n)}" data-write>${esc(n)}</button>`).join(''):'<span class="muted">לא נמצאו חלופות במאגר – אפשר לכתוב שם ידנית</span>'} <button class="btn ghost sm" data-act="swapClose">סגירה</button></td></tr>`}

/* ----- progress report ----- */
function vReport(c){
  const done=doneSessions(S.P);
  const names=[...new Set(done.slice().reverse().flatMap(d=>(d.exercises||[]).filter(e=>exStats(e).done.length).map(e=>e.name)))];
  const rows=names.map(n=>{const h=exHistory(S.P,n);const f=h[0],l=h[h.length-1];const u=unitOf(l.ex);
    const unit=u==='kg'?'ק״ג':u==='sec'?'שנ׳':'חזרות';const ch=f.best?Math.round((l.best-f.best)/f.best*100):0;
    return {n,f:f.best,l:l.best,unit,ch,cnt:h.length}}).filter(r=>r.cnt>=2).sort((a,b)=>b.ch-a.ch);
  const first=done.length?done[done.length-1].date:c.startDate;
  const logo=($('.brand img')||{}).src||'';
  const top=rows[0];
  const chart=top?lineChart(exHistory(S.P,top.n).map(p=>({x:p.date,y:p.best})),{unit:top.unit==='ק״ג'?'kg':''}):'';
  return `<div class="rbar"><button class="btn primary" data-act="printReport">🖨 הדפסה / שמירה כ־PDF</button><button class="btn ghost" data-act="closeReport">→ חזרה לתיק</button></div>
  <div class="report"><div class="rhead"><div><div class="eyebrow">דוח התקדמות · ${new Date().toLocaleDateString('he-IL')}</div><h1>${esc(c.name)}</h1><div class="muted">מתאמן/ת בכוח מחודש מאז ${fmt(first)}</div></div>${logo?`<img src="${logo}" alt="כוח מחודש">`:''}</div>
  <div class="stats"><div class="stat"><b>${done.length}</b>אימונים</div><div class="stat"><b>${rows.filter(r=>r.ch>0).length}</b>תרגילים עם שיפור</div>${top&&top.ch>0?`<div class="stat"><b>+${top.ch}%</b>${esc(top.n)}</div>`:''}</div>
  ${chart?`<h3>${esc(top.n)} – לאורך הזמן</h3>${chart}`:''}
  ${rows.length?`<h3>מה השתפר</h3><table><thead><tr><th>תרגיל</th><th>בהתחלה</th><th>היום</th><th>שינוי</th></tr></thead><tbody>${rows.slice(0,10).map(r=>`<tr><td>${esc(r.n)}</td><td>${r.f} ${r.unit}</td><td><b>${r.l} ${r.unit}</b></td><td class="${r.ch>0?'up':''}">${r.ch>0?'+':''}${r.ch}%</td></tr>`).join('')}</tbody></table>`:'<p class="muted">אחרי כמה אימונים יופיעו כאן נתוני ההתקדמות.</p>'}
  ${(c.goalsShort||c.goalsLong)?`<div class="goalbox">${c.goalsShort?`<div><b>מטרות קרובות:</b> ${esc(c.goalsShort)}</div>`:''}${c.goalsLong?`<div><b>מטרת על:</b> ${esc(c.goalsLong)}</div>`:''}</div>`:''}
  <div class="foot">כוח מחודש · מחזירים את הכוח, בונים איכות חיים</div></div>`;
}

/* ----- previous week ----- */
function prevPane(ctx,c,pane,pair){
  if(!ctx||!ctx.loaded) return `<section data-pane="${pane}"><div class="empty">טוען…</div></section>`;
  const curId=ctx.edit&&ctx.edit.id; const done=doneSessions(ctx).filter(d=>d.id!==curId);
  const labels=[...new Set(done.map(d=>String(d.label)))].sort();
  const head=pair?`<div class="pane-head"><h2>${esc(c.name)}</h2></div>`:'';
  if(!labels.length) return `<section data-pane="${pane}">${head}<div class="card empty"><strong>עדיין אין שבוע קודם</strong><span>אחרי שמסיימים את האימון הראשון, הוא יופיע כאן עם כל התוצאות.</span></div></section>`;
  return `<section data-pane="${pane}">${head}${labels.map(l=>pastWeeks(ctx,c,l,curId,1,labels.length>1?'אימון '+l+' בשבוע':'')).join('')}</section>`;
}
function tPrev(c){
  const p=partnerOf(c);
  const more=`<div class="row" style="margin-top:12px"><button class="btn ghost sm" data-act="goHistory">כל השבועות הקודמים ← היסטוריה</button></div>`;
  if(S.pairMode&&p&&S.Q) return `<div class="pairgrid">${prevPane(S.P,c,0,true)}${prevPane(S.Q,p,1,true)}</div>`+more;

/* ----- history ----- */

  if(!done.length) return `<div class="card empty"><strong>עדיין אין אימונים שבוצעו</strong><span>אחרי שמסיימים אימון בלשונית "תוכנית אימונים", הוא נשמר כאן עם כל התוצאות.</span></div>`;

   <div class="tbl-wrap"><table class="tbl"><thead><tr><th>תרגיל</th><th>יעד</th><th>בפועל</th><th>RIR</th><th>כאב</th></tr></thead><tbody>
   ${(d.exercises||[]).map(e=>{const st=exStats(e);return `<tr><td>${e.ss?`<span class="muted small">ס״ס ${esc(e.ss)} · </span>`:''}${esc(e.name)}</td><td class="muted" dir="ltr" style="text-align:right">${e.targetSets}×${e.repMin}–${e.repMax}${e.unit==='kg'&&e.targetKg!==''?` @ ${e.targetKg}kg`:''}</td><td dir="ltr" style="text-align:right">${st.done.map((s,i)=>e.unit==='kg'?`${st.kgs[i]}×${st.reps[i]}`:`${st.reps[i]}`).join(' · ')||'—'}</td><td>${e.rir!==''&&e.rir!=null?e.rir:'—'}</td><td>${num(e.pain)>=4?`<span class="chip bad">${e.pain}</span>`:(e.pain||'—')}</td></tr>`}).join('')}
   </tbody></table></div></div>`).join('')}</div>`;

/* ----- progress ----- */
function tProgress(c){
  const done=doneSessions(S.P);
  const names=[...new Set(done.slice().reverse().flatMap(d=>(d.exercises||[]).filter(e=>exStats(e).done.length).map(e=>e.name)))];
  if(!names.length) return `<div class="card empty"><strong>אין עדיין נתוני התקדמות</strong><span>הגרפים נבנים אוטומטית מהתוצאות שמזינים באימונים.</span></div>`;
  if(!names.includes(S.progEx)) S.progEx=names[0];
  const h=exHistory(S.P,S.progEx); const unit=h.length?h[h.length-1].unit:'kg';
  const bestLbl=unit==='kg'?'משקל עבודה מקסימלי (ק"ג)':unit==='sec'?'זמן מקסימלי (שנ׳)':'מקסימום חזרות בסט';
  const volLbl=unit==='kg'?'נפח אימון (ק"ג × חזרות)':'סך חזרות / שניות';
  const summary=names.map(n=>{const x=exHistory(S.P,n);const f=x[0],l=x[x.length-1];const ch=f.best?Math.round((l.best-f.best)/f.best*100):0;
    return `<tr class="clickrow" tabindex="0" data-prog="${esc(n)}"><td><b>${esc(n)}</b></td><td>${x.length}</td><td>${f.best}${l.unit==='kg'?' ק"ג':''}</td><td>${l.best}${l.unit==='kg'?' ק"ג':''}</td><td class="${ch>0?'delta-up':ch<0?'delta-down':''}" dir="ltr" style="text-align:right">${ch>0?'+':''}${ch}%</td></tr>`}).join('');
  return `<div class="labels">${names.map(n=>`<button class="chip" aria-pressed="${n===S.progEx}" data-prog="${esc(n)}">${esc(n)}</button>`).join('')}</div>
   <div class="grid2"><div class="card"><h3>${bestLbl}</h3>${lineChart(h.map(p=>({x:p.date,y:p.best})),{unit:unit==='kg'?'kg':''})}</div>
   <div class="card"><h3>${volLbl}</h3>${lineChart(h.map(p=>({x:p.date,y:p.vol})),{color:'var(--chart2)'})}</div></div>

/* ----- assessments ----- */
function tAssess(c){
  const rec=recTests(c);
  const list=S.assess.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const used=[...new Set([...rec,...list.flatMap(a=>Object.keys(a.values||{}))])].filter(k=>TESTS[k]);
  const recHtml=`<div class="card"><div class="spread"><div><h2>מבדקים מומלצים</h2><span class="muted small">לפי המטרות: ${(c.goals||[]).map(g=>esc(GOALS[g]||g)).join(', ')||'לא הוגדרו מטרות – מוצגים מבדקי בסיס'}</span></div>${S.newAssess?'':`<button class="btn primary" data-act="newAssess" data-write>+ מבדק חדש</button>`}</div>
    ${!c.sex?`<div class="banner info small">כדי להשוות לנורמות לגיל (קום-שב, כוח אחיזה) צריך למלא מין ושנת לידה בתיק המתאמן.</div>`:''}
    ${S.newAssess?`<div class="form-grid"><label class="f" for="a_date">תאריך<input id="a_date" type="date" value="${today()}"></label>
      ${used.map(k=>`<label class="f" for="t_${k}">${esc(TESTS[k].n)} <span class="muted">(${esc(TESTS[k].u)})</span><input id="t_${k}" type="number" step="any" inputmode="decimal" data-test="${k}"></label>`).join('')}
      <label class="f" for="a_more">מבדק נוסף<select id="a_more"><option value="">בחירה…</option>${Object.keys(TESTS).filter(k=>!used.includes(k)).map(k=>`<option value="${k}">${esc(TESTS[k].n)}</option>`).join('')}</select></label></div>
      <label class="f" for="a_notes">הערות<textarea id="a_notes"></textarea></label>
      <div class="row"><button class="btn primary" data-act="saveAssess" data-write>שמירת המבדק</button><button class="btn ghost" data-act="cancelAssess">ביטול</button></div>`:''}</div>`;
  if(!list.length) return recHtml+`<div class="card empty"><strong>עוד לא נערך מבדק</strong><span>מבדק פתיחה נותן נקודת ייחוס. אחרי כל מבדק תקופתי (כל 3 חודשים) רואים כאן את השינוי.</span></div>`;
  const cols=list.slice(0,6);
  const rows=used.filter(k=>list.some(a=>num((a.values||{})[k])!=null)).map(k=>{const t=TESTS[k];
    const cells=cols.map((a,i)=>{const v=num((a.values||{})[k]);if(v==null) return '<td class="muted">—</td>';
      const prev=list.slice(i+1).map(x=>num((x.values||{})[k])).find(x=>x!=null);
      let d='';if(prev!=null&&t.b!=='none'&&v!==prev){const good=(v>prev)===(t.b==='up');d=` <span class="${good?'delta-up':'delta-down'} small" dir="ltr">${v>prev?'▲':'▼'}${+Math.abs(v-prev).toFixed(2)}</span>`}
      return `<td><b>${v}</b>${d}</td>`}).join('');
    const latest=list.map(a=>num((a.values||{})[k])).find(x=>x!=null);
    const fl=t.flag&&latest!=null?t.flag(latest,c):null;
    return `<tr class="clickrow" tabindex="0" data-atest="${k}"><td><b>${esc(t.n)}</b><div class="muted small">${esc(t.u)}</div></td>${cells}<td>${fl?`<span class="chip bad">${esc(fl)}</span>`:''}</td></tr>`}).join('');
  if(!S.assTest||!used.includes(S.assTest)) S.assTest=used.find(k=>list.filter(a=>num((a.values||{})[k])!=null).length>=2)||used[0];
  const pts=list.slice().reverse().filter(a=>num((a.values||{})[S.assTest])!=null).map(a=>({x:a.date,y:num(a.values[S.assTest])}));
  return recHtml+`<div class="card"><h2>תוצאות מבדקים</h2><div class="tbl-wrap"><table class="tbl"><thead><tr><th>מבדק</th>${cols.map(a=>`<th>${fmt(a.date)}</th>`).join('')}<th>הערה</th></tr></thead><tbody>${rows}</tbody></table></div>
   ${list[0].notes?`<div class="muted small">הערות למבדק האחרון: ${esc(list[0].notes)}</div>`:''}</div>
   <div class="card"><h3>מגמה: ${esc(TESTS[S.assTest]?.n||'')}</h3>${lineChart(pts,{unit:TESTS[S.assTest]?.u||''})}<span class="muted small">לחצו על שורה בטבלה כדי להחליף מבדק.</span></div>`;
}

   <div class="tbl-wrap"><table class="tbl"><thead><tr><th>שם</th><th>מתאמנים פעילים</th><th>סטטוס</th><th></th></tr></thead><tbody>
   ${S.coaches.map(k=>`<tr><td><b>${esc(k.name)}</b></td><td>${activeClients().filter(c=>c.coachId===k.id).length}</td><td>${k.active===false?'<span class="chip">לא פעיל</span>':'<span class="chip up">פעיל</span>'}</td><td><div class="row"><button class="btn ghost sm" data-act="toggleCoach" data-id="${k.id}" data-write>${k.active===false?'הפעלה':'השבתה'}</button>${k.pinHash&&!window.FB?`<button class="btn ghost sm" data-act="resetPin" data-id="${k.id}" data-write>איפוס קוד</button>`:''}</div>${window.FB?`<div class="row" style="margin-top:6px"><input id="em_${k.id}" type="email" dir="ltr" placeholder="מייל לכניסה" value="${esc(k.email||'')}" style="min-width:220px"><button class="btn sm" data-act="coachEmail" data-id="${k.id}" data-write>שמירה</button></div>`:''}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">אין מאמנים עדיין</td></tr>'}

   <label class="f" for="st_upper">פלג גוף עליון ובטן<select id="st_upper" data-setting="upper">${[0.5,1,1.5,2,2.5].map(v=>`<option value="${v}"${num(S.settings.upper)===v?' selected':''}>${v} ק"ג</option>`).join('')}</select></label></div></div>

   <b>RIR מתחת ל-2 (קרוב מדי לכשל)</b> → אין העלאת משקל. אם גם לא הגיע לטווח, המשקל יורד בכ-10%. היעד הוא 3 חזרות ברזרבה בכל סט, ולא פחות מ-2.<br>
   <b>בתוך הטווח</b> → אותו משקל, לשאוף לחזרה נוספת.<br>
   <b>סט רחוק מתחתית הטווח</b> → הורדה של כ-10%.<br>

   תרגילי משקל גוף מתקדמים בסט נוסף ואז בחזרות; תרגילי זמן מתקדמים ב-5 שניות. סופר סטים והערות טמפו ומנוחה עוברים אוטומטית לשבוע הבא.</p>

  <div class="card"><h2>גיבוי</h2><span class="muted small">הורדת קובץ JSON עם כל המתאמנים, האימונים והמבדקים.</span><div class="row"><button class="btn" data-act="export">הורדת גיבוי מלא</button></div></div>`;
}

/* ---------- navigation ---------- */
function closeClient(){
  [S.P,S.Q].forEach(x=>{if(x&&x.unsub)x.unsub()}); if(S.assUnsub) S.assUnsub();
  S.P=null;S.Q=null;S.assUnsub=null;S.clientId=null;
}
function openClient(id,tab){
  closeClient();
  S.view='client'; S.clientId=id; S.tab=tab||'session'; S.assess=[]; S.progEx=null; S.assTest=null; S.newAssess=false; S.pairMode=false;
  S.P=mkCtx(id); subSessions(S.P);
  const c=clientById(id); if(c&&c.partnerId){S.Q=mkCtx(c.partnerId); subSessions(S.Q); S.pairMode=true;}
  S.assUnsub=S.db.collection('assessments').where('clientId','==',id).onSnapshot(snap=>{S.assess=snap.docs.map(d=>({id:d.id,...d.data()}));scheduleRender()},dbErr);
  render(); window.scrollTo(0,0);
}
function dbErr(e){ if(e&&e.code==='revoked'){S.db=null;S.offline=true;render()} else toast('טעינת הנתונים נכשלה – רעננו את הדף'); }

/* ---------- actions ---------- */
async function act(name,el){
  const c=client(); const ctx=ctxOf(el); const cc=ctx?clientById(ctx.clientId):null;
  switch(name){
  case 'backCoaches': closeClient(); S.view='coaches'; S.coachView=null; S.showNew=false; render(); window.scrollTo(0,0); break;
  case 'backCoach': {const k=S.coaches.some(x=>x.id===c?.coachId)?c.coachId:'none'; closeClient(); S.view='coaches'; S.coachView=k; S.showNew=false; render(); window.scrollTo(0,0); break;}
  case 'newClientGo': if(S.view==='client') closeClient(); S.view='clients'; S.showNew=true; render(); setTimeout(()=>$('#n_name')&&$('#n_name').focus(),0); break;
  case 'newClient': S.showNew=true; render(); setTimeout(()=>$('#n_name')&&$('#n_name').focus(),0); break;
  case 'cancelNew': S.showNew=false; render(); break;
  case 'createClient': {
    const name=$('#n_name').value.trim(); if(!name){toast('צריך להזין שם');return}
    const ref=S.db.collection('clients').doc(); const ttyp=$('#n_type').value; const partner=ttyp==='pair'?$('#n_partner').value:''; const groupName=ttyp==='group'?$('#n_group').value.trim():'';
    const ok=await saveDoc('clients/'+ref.id,{name,coachId:$('#n_coach').value,freq:Number($('#n_freq').value),trainingType:ttyp,partnerId:partner,groupName,startDate:$('#n_start').value||today(),status:'active',goals:[],createdAt:Date.now(),hasPlan:false,pendingApproval:false});
    if(ok){ if(partner) await updClient(partner,{partnerId:ref.id}); S.showNew=false; openClient(ref.id,'session'); toast('המתאמן נוצר – בנו את האימון הראשון, ואת התיק אפשר להשלים בלשונית "תיק מתאמן"'); }
    break;}
  case 'saveProfile': {
    const goals=[...document.querySelectorAll('#p_goals [data-goal]')].filter(b=>b.getAttribute('aria-pressed')==='true').map(b=>b.dataset.goal);
    const by=num($('#p_by').value); const ttyp=$('#p_type').value; const newP=ttyp==='pair'?$('#p_partner').value:'', oldP=c.partnerId||'';
    const ok=await updClient(c.id,{name:$('#p_name').value.trim()||c.name,sex:$('#p_sex').value,birthYear:by??'',coachId:$('#p_coach').value,freq:Number($('#p_freq').value),trainingType:ttyp,groupName:ttyp==='group'?$('#p_group').value.trim():'',partnerId:newP,startDate:$('#p_start').value,status:$('#p_status').value,goals,
      goalsShort:$('#p_gshort').value.trim(),goalsLong:$('#p_glong').value.trim(),
      limits:$('#p_limits').value.trim(),conditions:$('#p_cond').value.trim(),surgeries:$('#p_surg').value.trim(),meds:$('#p_meds').value.trim(),history:$('#p_hist').value.trim(),
      emergency:{name:$('#p_em_name').value.trim(),rel:$('#p_em_rel').value.trim(),phone:$('#p_em_phone').value.trim()},updatedAt:Date.now()});
    if(ok&&newP!==oldP){
      if(oldP) await updClient(oldP,{partnerId:''});
      if(newP) await updClient(newP,{partnerId:c.id});
      if(S.Q&&S.Q.unsub) S.Q.unsub(); S.Q=null; S.pairMode=false;
      if(newP){S.Q=mkCtx(newP);subSessions(S.Q);S.pairMode=true;}
    }
    if(ok) toast('התיק נשמר'); break;}
  case 'askDelClient': S.confirmDelClient=c.id; render(); break;
  case 'cancelDelClient': S.confirmDelClient=null; render(); break;
  case 'delClient': {
    S.confirmDelClient=null;
    try{
      const [ss,as]=await Promise.all([S.db.collection('sessions').where('clientId','==',c.id).get(),S.db.collection('assessments').where('clientId','==',c.id).get()]);
      for(const d of ss.docs) await S.db.doc('sessions/'+d.id).delete();
      for(const d of as.docs) await S.db.doc('assessments/'+d.id).delete();
      if(c.partnerId) await updClient(c.partnerId,{partnerId:''});
      const id=c.id; closeClient(); await S.db.doc('clients/'+id).delete();
      S.view='coaches'; toast('המתאמן נמחק'); render();
    }catch(e){ onWriteError(e); }
    break;}
  case 'toggleMore': S.moreOpen=!(S.moreOpen||['history','progress','assess'].includes(S.tab)); if(!S.moreOpen&&['history','progress','assess'].includes(S.tab)) S.tab='session'; render(); break;
  case 'pairOn': S.pairMode=true; render(); break;
  case 'pairOff': S.pairMode=false; render(); break;
  case 'startPlan': {const ref=S.db.collection('sessions').doc(); const doc=blankPlan(ctx.clientId,'1',el.dataset.mode); ctx.edit={id:ref.id,doc,local:true}; render(); await saveDoc('sessions/'+ref.id,doc); updClient(ctx.clientId,{hasPlan:true}); break;}
  case 'firstPlan': case 'copyFrom': {
    const label=el.dataset.label||'1';
    let exercises=templateExercises();
    if(name==='copyFrom'){const other=ctx===S.Q?S.P:S.Q; exercises=(other.edit.doc.exercises||[]).filter(e=>e.name).map(e=>({id:uid(),...carry(e),targetSets:e.targetSets,targetKg:'',repMin:e.repMin,repMax:e.repMax,sets:Array.from({length:Number(e.targetSets)||2},()=>({kg:'',reps:''})),rir:'',pain:'',note:'',sugg:null}));}
    const ref=(ctx.edit&&ctx.edit.fresh)?{id:ctx.edit.id}:S.db.collection('sessions').doc();
    const doc={clientId:ctx.clientId,label,seq:1,status:'planned',approved:true,date:'',coach:'',notes:'',warmup:'',exercises,createdAt:Date.now()};
    ctx.edit={id:ref.id,doc,local:true}; await saveDoc('sessions/'+ref.id,doc); updClient(ctx.clientId,{hasPlan:true}); render(); break;}
  case 'addEx': {const a=ctx.edit.doc.exercises; const ss=el.dataset.ss||''; const ne={...newExercise(),ss};
    if(ss){let last=-1;a.forEach((e,i)=>{if(String(e.ss)===String(ss))last=i}); a.splice(last+1,0,ne);} else a.push(ne);
    saveEdit(ctx,0); render(); break;}
  case 'joinEx': {const a=ctx.edit.doc.exercises; const i=Number(el.dataset.i); const k=String(Math.max(0,...a.map(e=>Number(e.ss)||0))+1); a[i].ss=k; a.splice(i+1,0,{...newExercise(),ss:k}); saveEdit(ctx,0); render(); break;}
  case 'prog': {const ex=ctx.edit.doc.exercises[Number(el.closest('[data-ex]').dataset.ex)]; const k=el.dataset.k;
    if(k==='none') ex.prog=[]; else {const set=new Set(ex.prog||[]); set.has(k)?set.delete(k):set.add(k); ex.prog=[...set];}
    applyProg(ex); saveEdit(ctx,0); render(); break;}
  case 'addSS': {const a=ctx.edit.doc.exercises; const k=String(Math.max(0,...a.map(e=>Number(e.ss)||0))+1); a.push({...newExercise(),ss:k},{...newExercise(),ss:k}); saveEdit(ctx,0); render(); break;}
  case 'exUp': case 'exDown': case 'exDel': {
    const i=Number(el.closest('[data-ex]').dataset.ex); const a=ctx.edit.doc.exercises;
    if(name==='exDel') a.splice(i,1); else {const j=name==='exUp'?i-1:i+1; [a[i],a[j]]=[a[j],a[i]];}
    saveEdit(ctx,0); render(); break;}
  case 'approve': ctx.edit.doc.approved=true; await saveEdit(ctx,0); syncPlanFlags(ctx); toast('התוכנית אושרה'); render(); break;
  case 'askAdd': ctx.addOpen=!ctx.addOpen; render(); break;
  case 'addDay': {
    const used=new Set(ctx.sessions.map(s=>String(s.label))); const label=['1','2'].find(l=>!used.has(l)); if(!label){toast('כבר יש למתאמן שני אימונים בשבוע');return}
    let exercises=templateExercises(el.dataset.mode);
    const src=el.dataset.src?ctx.sessions.find(s=>s.id===el.dataset.src):null;
    const srcDoc=src&&ctx.edit&&ctx.edit.id===src.id?ctx.edit.doc:src;
    if(srcDoc) exercises=(srcDoc.exercises||[]).filter(e=>e.name).map(e=>({id:uid(),...carry(e),targetSets:e.targetSets,targetKg:e.targetKg,repMin:e.repMin,repMax:e.repMax,sets:Array.from({length:Number(e.targetSets)||2},()=>({kg:'',reps:''})),rir:'',pain:'',note:'',sugg:null}));
    const ref=S.db.collection('sessions').doc();
    const doc={clientId:ctx.clientId,label,seq:1,status:'planned',approved:true,date:'',coach:'',notes:'',warmup:(srcDoc&&srcDoc.warmup)||'',exercises,createdAt:Date.now()};
    ctx.addOpen=false; ctx.edit={id:ref.id,doc,local:true}; await saveDoc('sessions/'+ref.id,doc);
    const labels=new Set([...used,label]); const cl=clientById(ctx.clientId);
    updClient(ctx.clientId,{hasPlan:true,...(cl&&Number(cl.freq||1)<labels.size?{freq:labels.size}:{})});
    toast(`נוסף אימון ${label} בשבוע`); render(); break;}
  case 'complete': {
    const d=ctx.edit.doc;
    if(!d.exercises.some(e=>exStats(e).done.length)){toast('לא הוזנו תוצאות – הזינו חזרות לפחות בסט אחד');return}
    d.status='done'; d.approved=true; d.date=d.date||today(); d.completedAt=Date.now(); d.coach=coachName(cc&&cc.coachId)!=='—'?coachName(cc.coachId):(d.coach||'');
    d.exercises=d.exercises.filter(e=>e.name);
    const doneId=ctx.edit.id;
    const ok=await saveEdit(ctx,0); if(!ok){d.status='planned';return}
    const local=ctx.sessions.find(s=>s.id===doneId); if(local) Object.assign(local,clone(d));
    const maxPain=Math.max(0,...d.exercises.map(e=>num(e.pain)||0));
    const patch={lastSessionDate:d.date,lastCoach:d.coach,hasPlan:false,pendingApproval:false};
    if(cc&&(!cc.startDate||cc.startDate>d.date)) patch.startDate=d.date;
    if(maxPain>=4) patch.painDate=d.date;
    updClient(ctx.clientId,patch); ctx.confirmDel=null;
    toast(`שבוע ${d.seq} של ${cc?cc.name:''} נשמר עם כל התוצאות`); render(); break;}
  case 'planNext': {
    let d=ctx.edit.doc;
    if(d.status!=='done'){ if(!d.exercises.some(e=>exStats(e).done.length)){toast('קודם מזינים את תוצאות האימון הזה');return} await act('complete',el); d=ctx.edit.doc; if(d.status!=='done') return; }
    const np=ctx.sessions.find(x=>x.status==='planned'&&String(x.label)===String(d.label)&&x.id!==ctx.edit.id);
    if(np){ctx.edit={id:np.id,doc:clone(np)};render();window.scrollTo(0,0);return}
    const base=ctx.sessions.find(x=>x.id===ctx.edit.id)||{id:ctx.edit.id,...d};
    const next=buildNext(ctx,base,ctx.edit.id); const ref=S.db.collection('sessions').doc();
    ctx.edit={id:ref.id,doc:next,local:true}; await saveDoc('sessions/'+ref.id,next); updClient(ctx.clientId,{hasPlan:true,pendingApproval:false}); render(); window.scrollTo(0,0); break;}
  case 'buildFrom': {
    const base=ctx.sessions.find(s=>s.id===el.dataset.id); if(!base) return;
    const next=buildNext(ctx,base,base.id); const ref=S.db.collection('sessions').doc();
    ctx.edit={id:ref.id,doc:next,local:true}; await saveDoc('sessions/'+ref.id,next); updClient(ctx.clientId,{hasPlan:true,pendingApproval:false}); render(); window.scrollTo(0,0); break;}
  case 'askNewProg': ctx.newProg=true; render(); break;
  case 'cancelNewProg': ctx.newProg=false; render(); break;
  case 'newProgram': {
    if(!ctx.edit){toast('אין תוכנית פתוחה');return}
    const cur=ctx.edit.doc, curId=ctx.edit.id, wasFresh=ctx.edit.fresh; ctx.newProg=false;
    const maxP=Math.max(1,...ctx.sessions.filter(x=>String(x.label)===String(cur.label)).map(x=>Number(x.programNo)||1));
    const doc=blankPlan(ctx.clientId,cur.label,el.dataset.mode==='single'?'single':'ss'); doc.programNo=maxP+1; doc.warmup=cur.warmup||'';
    if(el.dataset.mode==='copy') doc.exercises=(cur.exercises||[]).filter(e=>e.name).map(e=>({id:uid(),...carry(e),targetSets:e.targetSets,targetKg:e.targetKg,repMin:e.repMin,repMax:e.repMax,sets:Array.from({length:Number(e.targetSets)||2},()=>({kg:'',reps:''})),rir:'',pain:'',note:'',sugg:null}));
    const hasResults=(cur.exercises||[]).some(e=>exStats(e).done.length);
    if(!wasFresh&&!hasResults){ try{await S.db.doc('sessions/'+curId).delete();}catch(e){onWriteError(e);return} ctx.sessions=ctx.sessions.filter(x=>x.id!==curId); }
    const ref=S.db.collection('sessions').doc(); ctx.edit={id:ref.id,doc,local:true};
    await saveDoc('sessions/'+ref.id,doc); updClient(ctx.clientId,{hasPlan:true,pendingApproval:false});
    toast(`נפתחה תוכנית ${doc.programNo} – השבועות הקודמים נשמרו למטה`); render(); window.scrollTo(0,0); break;}
  case 'askDel': ctx.confirmDel=ctx.edit.id; render(); break;
  case 'cancelDel': ctx.confirmDel=null; render(); break;
  case 'delSess': {
    const id=ctx.edit.id; ctx.confirmDel=null;
    try{ await S.db.doc('sessions/'+id).delete(); }catch(e){ onWriteError(e); return; }
    ctx.sessions=ctx.sessions.filter(s=>s.id!==id); ctx.edit=null; syncPlanFlags(ctx); toast('נמחק'); render(); break;}
  case 'openSess': {const cx=el.closest('[data-pane]')?ctx:S.P; const s=cx.sessions.find(x=>x.id===el.dataset.id); if(s){cx.edit={id:s.id,doc:clone(s)}; if(!el.closest('[data-pane]')) S.pairMode=false; S.tab='session'; render(); window.scrollTo(0,0);} break;}
  case 'backPlanned': ctx.edit=null; render(); break;
  case 'newAssess': S.newAssess=true; render(); break;
  case 'cancelAssess': S.newAssess=false; render(); break;
  case 'saveAssess': {
    const values={}; document.querySelectorAll('[data-test]').forEach(i=>{const v=num(i.value); if(v!=null) values[i.dataset.test]=v;});
    if(!Object.keys(values).length){toast('לא הוזנו תוצאות');return}
    const date=$('#a_date').value||today(); const ref=S.db.collection('assessments').doc();
    const ok=await saveDoc('assessments/'+ref.id,{clientId:c.id,date,values,notes:$('#a_notes').value.trim(),coach:coachName(c.coachId)!=='—'?coachName(c.coachId):'',createdAt:Date.now()});
    if(ok){ if(!c.lastAssessmentDate||date>c.lastAssessmentDate) updClient(c.id,{lastAssessmentDate:date}); S.newAssess=false; toast('המבדק נשמר'); render(); }
    break;}
  case 'noteEdit': S.noteEdit=S.clientId; render(); {const t=$('#noteTxt');if(t){t.focus();t.setSelectionRange(t.value.length,t.value.length)}} break;
  case 'noteCancel': S.noteEdit=null; render(); break;
  case 'noteSave': {const v=($('#noteTxt')||{}).value||''; const id=S.clientId; const val=v.trim()?{text:v.trim(),by:S.meId||'',at:Date.now()}:null; const cl=clientById(id); if(cl)cl.handoff=val; S.noteEdit=null; render(); await updClient(id,{handoff:val}); toast(val?'ההערה נשמרה':'ההערה הוסרה'); break;}
  case 'noteClear': {const id=S.clientId; const cl=clientById(id); if(cl)cl.handoff=null; render(); await updClient(id,{handoff:null}); toast('ההערה הוסרה'); break;}
  case 'logout': logout(); break;
  case 'coachEmail': {const k=S.coaches.find(x=>x.id===el.dataset.id); const e=($('#em_'+k.id).value||'').trim().toLowerCase(); if(e&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)){toast('כתובת מייל לא תקינה');break}
    try{await window.FB.setStaff(k.id,k.email||'',e); await saveDoc('coaches/'+k.id,{email:e},{merge:true}); toast(e?`${k.name} יוכל להיכנס עם ${e}`:'המייל הוסר');}catch(err){toast('רק מנהל יכול לשנות הרשאות כניסה')} break;}
  case 'openReport': S.report=S.clientId; render(); window.scrollTo(0,0); break;
  case 'closeReport': S.report=null; render(); break;
  case 'printReport': try{window.print()}catch(e){toast('ההדפסה לא זמינה בתצוגה הזו')} break;
  case 'swapOpen': {const ex=ctx.edit.doc.exercises[Number(el.dataset.i)]; S.swapEx=S.swapEx===ex.id?null:ex.id; render(); break;}
  case 'swapClose': S.swapEx=null; render(); break;
  case 'swapTo': {const ex=ctx.edit.doc.exercises[Number(el.closest('[data-ex]').dataset.ex)]; const n=el.dataset.name; const l=libFind(n); const old=ex.name;
    ex.name=n; if(l){ex.unit=l[1];ex.group=l[2];} ex.targetKg=''; if(ex.base){ex.base.targetKg='';} S.swapEx=null; saveEdit(ctx,0); render(); toast(`הוחלף: ${old} ← ${n}. לעדכן משקל עבודה`); break;}
  case 'cueSave': {const n=($('#cueName').value||'').trim(); if(!n){toast('בחרו תרגיל');break} const t=$('#cueText').value.trim(), v=$('#cueVideo').value.trim();
    const m={...(S.cues||{})}; if(t||v) m[n]={t,v}; else delete m[n]; S.cues=m; await saveDoc('settings/cues',m); toast('הדגשים נשמרו'); S.cueEdit=null; render(); break;}
  case 'cueEdit': S.cueEdit=el.dataset.name; render(); break;
  case 'cueDel': {const m={...(S.cues||{})}; delete m[el.dataset.name]; S.cues=m; await saveDoc('settings/cues',m); render(); break;}
  case 'goHistory': S.tab='history'; S.moreOpen=true; render(); window.scrollTo(0,0); break;
  case 'pickMe': S.loginPick=el.dataset.id; S.loginErr=''; render(); afterLoginFocus(); break;
  case 'loginBack': S.loginPick=null; S.loginErr=''; render(); break;
  case 'doLogin': await doLogin(); break;
  case 'resetPin': {const k=S.coaches.find(x=>x.id===el.dataset.id); if(!k) break; if(el.dataset.sure!=='1'){el.dataset.sure='1';el.textContent='לחצו שוב לאיפוס';setTimeout(()=>{if(el.isConnected){el.dataset.sure='';el.textContent='איפוס קוד'}},4000);break} await saveDoc('coaches/'+k.id,{pinHash:null},{merge:true}); toast('הקוד של '+k.name+' אופס – בכניסה הבאה יבחר קוד חדש'); break;}
  case 'addCoach': {const n=$('#newCoach').value.trim(); if(!n) return; const ref=S.db.collection('coaches').doc(); await saveDoc('coaches/'+ref.id,{name:n,active:true,createdAt:Date.now()}); toast('המאמן נוסף'); break;}
  case 'toggleCoach': {const k=S.coaches.find(x=>x.id===el.dataset.id); if(k) saveDoc('coaches/'+k.id,{active:k.active===false},{merge:true}); break;}
  case 'export': {
    const dl=(window.claude&&window.claude.use)?await window.claude.use('downloads'):null; if(!dl){toast('הורדת קבצים לא זמינה בתצוגה הזו');return}
    try{
      const [ss,as]=await Promise.all([S.db.collection('sessions').get(),S.db.collection('assessments').get()]);
      const data={exportedAt:new Date().toISOString(),coaches:S.coaches,clients:S.clients,sessions:ss.docs.map(d=>({id:d.id,...d.data()})),assessments:as.docs.map(d=>({id:d.id,...d.data()}))};
      const r=await dl.save({filename:`restrength-backup-${today()}.json`,data:JSON.stringify(data,null,1)});
      if(r&&r.status==='saved') toast('הגיבוי נשמר');
    }catch(e){ if(e&&e.code!=='cancelled') toast('הגיבוי לא הושלם'); }
    break;}
  }
}

/* ---------- events ---------- */
let ZOOM=Number(lsGet('rs_zoom'))||1;
function applyZoom(){ZOOM=Math.min(1.8,Math.max(0.8,Math.round(ZOOM*10)/10));document.querySelector('.app').style.zoom=ZOOM;$('#zVal').textContent=Math.round(ZOOM*100)+'%';lsSet('rs_zoom',ZOOM)}
function bind(){
  $('#zIn').addEventListener('click',()=>{ZOOM+=0.1;applyZoom()}); $('#zOut').addEventListener('click',()=>{ZOOM-=0.1;applyZoom()}); applyZoom();
  bindSearch();
  $('#who').addEventListener('click',e=>{if(e.target.closest('button'))logout()});
  $('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-nav]');if(!b)return; if(!S.meId&&S.db)return; closeClient(); if(b.dataset.nav==='mine'){S.view='coaches';S.coachView=S.meId}else{S.view=b.dataset.nav; S.coachView=null;} S.showNew=false; render(); window.scrollTo(0,0);});
  const main=$('#main');
  main.addEventListener('click',e=>{
    const t=e.target;
    const navg=t.closest('[data-nav-go]'); if(navg){ closeClient(); S.view=navg.dataset.navGo; render(); return;}
    const a=t.closest('[data-act]'); if(a&&!a.disabled){act(a.dataset.act,a);return}
    const o=t.closest('[data-open]'); if(o){S.showNew=false;openClient(o.dataset.open);return}
    const mc=t.closest('[data-mgrcoach]'); if(mc){S.view='coaches';S.coachView=mc.dataset.mgrcoach;render();window.scrollTo(0,0);return}
    const kc=t.closest('[data-coach]'); if(kc){S.coachView=kc.dataset.coach;S.showNew=false;render();window.scrollTo(0,0);return}
    const cf=t.closest('[data-coachfilter]'); if(cf){S.view='clients';S.filterCoach=cf.dataset.coachfilter;render();return}
    const tb=t.closest('[data-tab]'); if(tb){S.tab=tb.dataset.tab;S.newAssess=false;render();return}
    const pk=t.closest('[data-pick]'); if(pk){const ctx=ctxOf(pk);const s=ctx.sessions.find(x=>x.id===pk.dataset.pick);if(s){ctx.edit={id:s.id,doc:clone(s)};ctx.confirmDel=null;render()}return}
    const pg=t.closest('[data-prog]'); if(pg){S.progEx=pg.dataset.prog;render();return}
    const at=t.closest('[data-atest]'); if(at){S.assTest=at.dataset.atest;render();return}
    const g=t.closest('[data-goal]'); if(g&&S.canWrite){g.setAttribute('aria-pressed',String(g.getAttribute('aria-pressed')!=='true'));return}
  });
  main.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&(e.target.id==='pin1'||e.target.id==='pin2')){e.preventDefault(); if(e.target.id==='pin1'&&$('#pin2')&&!$('#pin2').value){$('#pin2').focus();return} doLogin();return}
    if(e.target.type==='number'&&(e.key==='-'||e.key==='e'||e.key==='E'||e.key==='+')){e.preventDefault();return}
    if(e.key==='Enter'&&e.target.classList.contains('clickrow')){e.target.click();return}
    if(e.key==='Enter'&&e.target.classList.contains('si')){e.preventDefault();const scope=e.target.closest('[data-pane]')||main;const all=[...scope.querySelectorAll('.si')];const i=all.indexOf(e.target);if(all[i+1])all[i+1].focus();else e.target.blur();}
  });
  main.addEventListener('input',e=>{
    const t=e.target;
    if(t.type==='number'&&t.value!==''&&Number(t.value)<0){t.value='';}
    if(t.id==='q'){S.q=t.value;clearTimeout(S.qT);S.qT=setTimeout(()=>{const p=t.selectionStart;render();const q=$('#q');if(q){q.focus();q.setSelectionRange(p,p)}},250);return}
    const f=t.dataset.f; const ctx=ctxOf(t); if(!f||!ctx||!ctx.edit) return;
    const d=ctx.edit.doc;
    if(f==='sess.notes'){d.notes=t.value;saveEdit(ctx,900);return}
    if(f==='client.warmup'){const cl=clientById(ctx.clientId); if(cl) cl.warmup=t.value; saveDoc('clients/'+ctx.clientId,{warmup:t.value},{merge:true,delay:900}); d.warmup=t.value; saveEdit(ctx,900); return}
    if(f==='sess.date'){d.date=t.value;saveEdit(ctx,300);return}
    const card=t.closest('[data-ex]'); if(!card) return; const ex=d.exercises[Number(card.dataset.ex)];
    if(t.dataset.set!=null&&t.classList.contains('si')&&t.value!==''){const card0=t.closest('[data-ex]');const ex0=card0&&d.exercises[Number(card0.dataset.ex)];const mx=Math.max(num(ex0&&ex0.repMax)||10,10);
      if(Number(t.value)*10>mx+5){setTimeout(()=>{const scope=t.closest('[data-pane]')||main;const all=[...scope.querySelectorAll('.si')];const k=all.indexOf(t);if(all[k+1])all[k+1].focus();else t.blur();},0);}}
    if(t.dataset.set!=null){if(!d.date&&t.value!==''){d.date=today();const di=t.closest('[data-pane]')?.querySelector('[data-f="sess.date"]');if(di)di.value=d.date;} const s=ex.sets[Number(t.dataset.set)]; s[f]=t.value===''?'':Number(t.value); if(f==='reps') t.dataset.st=setState(ex,s); saveEdit(ctx,700); return}
    if(['name','note','tempo'].includes(f)){ex[f]=t.value;saveEdit(ctx,900);return}
    if(['targetKg','repMin','repMax','rir','rirTarget','pain'].includes(f)){ex[f]=t.value===''?'':Number(t.value);if(f==='rir')t.dataset.st=num(ex.rir)!=null&&ex.rir<2?'low':'';if(f==='pain')t.dataset.st=num(ex.pain)>=4?'low':'';saveEdit(ctx,700);return}
  });
  main.addEventListener('change',e=>{
    const t=e.target;
    if(t.id==='fCoach'){S.filterCoach=t.value;render();return}
    if(t.id==='fStatus'){S.filterStatus=t.value;render();return}
    if(t.dataset.setting){S.settings={...S.settings,[t.dataset.setting]:Number(t.value)};saveDoc('settings/progression',{lower:S.settings.lower,upper:S.settings.upper});toast('נשמר');return}
    if(t.dataset.typesel){const k=t.dataset.typesel;$('#'+k+'_pairwrap').hidden=t.value!=='pair';$('#'+k+'_groupwrap').hidden=t.value!=='group';return}
    if(t.id==='a_more'&&t.value){const k=t.value;const grid=t.closest('.form-grid');const lab=document.createElement('label');lab.className='f';lab.htmlFor='t_'+k;lab.innerHTML=`${esc(TESTS[k].n)} <span class="muted">(${esc(TESTS[k].u)})</span><input id="t_${k}" type="number" step="any" inputmode="decimal" data-test="${k}">`;grid.insertBefore(lab,t.closest('label'));t.querySelector(`option[value="${k}"]`).remove();t.value='';lab.querySelector('input').focus();return}
    const f=t.dataset.f; const ctx=ctxOf(t); if(!f||!ctx||!ctx.edit) return;
    const card=t.closest('[data-ex]'); if(!card) return; const ex=ctx.edit.doc.exercises[Number(card.dataset.ex)];
    const structural=()=>{saveEdit(ctx,0);S.deferred=true;t.blur();};
    if(f==='name'){const l=libFind(t.value.trim());ex.name=t.value.trim();if(l){ex.unit=l[1];ex.group=l[2];if(l[1]==='sec'&&ex.repMin===6){ex.repMin=20;ex.repMax=30}structural()}else saveEdit(ctx,0);return}
    if(f==='ss'){ex.ss=t.value;structural();return}
    if(f==='unit'){ex.unit=t.value;if(t.value==='sec'&&ex.repMin===6){ex.repMin=20;ex.repMax=30}structural();return}
    if(f==='targetSets'){const n=Math.max(1,Math.min(10,Number(t.value)||1));ex.targetSets=n;while(ex.sets.length<n)ex.sets.push({kg:'',reps:''});while(ex.sets.length>n&&num(ex.sets[ex.sets.length-1].reps)==null)ex.sets.pop();structural();return}
  });
  main.addEventListener('focusout',()=>{setTimeout(()=>{if(S.deferred&&!editorFocused())render()},0)});
}

/* ---------- boot ---------- */
async function boot(){
  $('#lib').innerHTML=LIB.map(l=>`<option value="${esc(l[0])}">`).join('');
  bind(); render();
  const use=n=>(window.claude&&window.claude.use)?window.claude.use(n):Promise.resolve(null);
  const [db,user]=await Promise.all([use('db'),use('user')]);
  if(!db){S.offline=true;render();return}
  S.db=db; S.user=user; if(user&&user.coachId){S.meId=user.coachId;}
  if(user){const cw=await user.can('data.write'); if(cw===false) S.canWrite=false;}
  db.collection('coaches').onSnapshot(snap=>{S.coaches=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));const firstC=!S.loaded.c;S.loaded.c=true;if(firstC&&S.meId&&S.view==='coaches'&&!S.coachView)S.coachView=S.meId;scheduleRender()},dbErr);
  db.doc('settings/cues').onSnapshot(sn=>{S.cues=sn.exists?(sn.data()||{}):{};scheduleRender()},()=>{});
  db.doc('settings/progression').onSnapshot(sn=>{if(sn.exists)S.settings={lower:1,upper:0.5,...sn.data()};scheduleRender()},()=>{});
  let linked=false;
  db.collection('clients').onSnapshot(snap=>{S.clients=snap.docs.map(d=>({id:d.id,...d.data()}));S.loaded.k=true;
    const h=(location.hash||'').slice(1); if(!linked&&h&&S.clients.some(c=>c.id===h)){linked=true;openClient(h,'session');return}
    scheduleRender()},dbErr);
  render();
}
boot();
