<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">

<meta name="referrer" content="no-referrer">

<title>התוכנית שלי · כוח מחודש</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Suez+One&display=swap">
<style>
:root{--bg:#F6F4F3;--card:#fff;--ink:#151313;--muted:#5E5554;--line:#E2D9D7;--accent:#EA2328;--good:#1A7F45;--good-bg:#E3F4EA;--soft:#F8F3F2;
  --head:"Suez One","Arial Hebrew",Georgia,serif;--body:"Rubik","Arial Hebrew",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:20px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.band{background:#000;border-bottom:3px solid var(--accent);padding:10px 16px calc(10px);display:flex;align-items:center;justify-content:center}
.band{position:relative}.band img{height:64px;width:auto;display:block}
.fz{position:absolute;left:12px;top:50%;transform:translateY(-50%);display:flex;gap:6px}
.fz button{background:#2a2524;color:#fff;border:0;border-radius:12px;font:inherit;font-weight:700;font-size:22px;width:56px;height:48px;cursor:pointer}
#app{zoom:var(--fz,1)}
.say{display:inline-flex;align-items:center;gap:8px;margin-top:10px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:8px 18px;font:inherit;font-size:19px;font-weight:700;color:var(--ink);cursor:pointer}
.say.on{background:#151313;color:#fff;border-color:#151313}
.a2hs{border:2px dashed #b9aeac;background:#fff}.a2hs ol{margin:8px 0 0;padding-inline-start:24px}.a2hs li{margin:6px 0}
.a2hs .x{float:left;background:none;border:0;font-size:28px;color:var(--muted);cursor:pointer}
main{max-width:640px;margin:0 auto;padding:18px 16px 60px}
h1{font-family:var(--head);font-weight:400;font-size:34px;line-height:1.2;margin:6px 0 4px}
h2{font-family:var(--head);font-weight:400;font-size:27px;margin:30px 0 10px}
.sub{color:var(--muted);font-size:19px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.ex .num{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:20px;margin-inline-end:10px;flex:none}
.ex .t{display:flex;align-items:center;font-size:23px;font-weight:700;line-height:1.3}
.dose{margin:10px 0 0;font-size:22px;font-weight:700;color:var(--ink)}
.freq{font-size:20px;color:var(--muted);margin:2px 0 0}
.note{margin:10px 0 0;padding:10px 12px;background:var(--soft);border-radius:12px;font-size:19px}
.media{margin-top:12px}
.media img,.media video{width:100%;border-radius:14px;background:#000;display:block;max-height:70vh}
.play{width:100%;min-height:150px;border:0;border-radius:14px;background:#1d1a1a;color:#fff;font:inherit;font-size:22px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.play .tri{width:0;height:0;border-style:solid;border-width:22px 0 22px 36px;border-color:transparent transparent transparent #fff;transform:scaleX(-1)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:64px;border-radius:16px;border:2px solid transparent;font:inherit;font-size:23px;font-weight:700;cursor:pointer;margin-top:14px;text-decoration:none}
.btn.done{background:var(--good);color:#fff}
.btn.alt{background:#fff;border-color:var(--line);color:var(--ink);font-size:20px;min-height:58px}
.btn:disabled{opacity:.6}
.did{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--good-bg);color:var(--good);font-weight:700;font-size:19px}
.more{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.more .btn{margin:0;font-size:17px;min-height:64px;flex-direction:column;gap:2px;padding:6px}
.more .btn span{font-size:26px;line-height:1}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week div{font-size:16px;color:var(--muted)}
.week b{display:grid;place-items:center;width:42px;height:42px;margin:4px auto 0;border-radius:50%;border:2px solid var(--line);font-size:20px;color:#fff}
.week b.y{background:var(--good);border-color:var(--good)}
.week .today b{border-color:var(--ink)}
.bars{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:10px}
.bars .bc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bars .bv{width:100%;max-width:46px;border-radius:10px 10px 4px 4px;background:var(--accent)}
.bars .bn{font-weight:700;font-size:19px}
.bars .bd{font-size:14px;color:var(--muted);margin-top:4px;white-space:nowrap}
.msg{font-size:20px;font-weight:700;color:var(--good);margin:12px 0 0}
.rules{font-size:18px;color:var(--ink)}
.sum{border-inline-start:5px solid var(--accent)}.sum .sh{font-weight:700;font-size:22px;margin-bottom:4px}.sum p{margin:4px 0 0}.sum .sh2{font-weight:700;margin-top:12px}.sum ul{margin:4px 0 0;padding-inline-start:22px}
.cues{margin:4px 0 0;padding-inline-start:22px}.cues li{margin:2px 0}
.rules p{margin:8px 0}
.red{border-color:#E9B7B2;background:#FDF1EF}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet .box{background:#fff;width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet h3{font-family:var(--head);font-weight:400;font-size:28px;margin:0 0 12px;text-align:center}
.faces{display:grid;grid-template-columns:1fr;gap:8px}
.face{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;border:2px solid var(--line);border-radius:16px;background:#fff;font:inherit;font-size:22px;font-weight:700;cursor:pointer;padding:6px 16px;text-align:start}
.face span{font-size:40px;line-height:1}
textarea{width:100%;min-height:140px;font:inherit;font-size:21px;border:2px solid var(--line);border-radius:14px;padding:12px}
.recdot{width:110px;height:110px;border-radius:50%;background:var(--accent);border:6px solid #fff;box-shadow:0 0 0 3px var(--accent);margin:10px auto;display:block;cursor:pointer}
.recdot.on{border-radius:24px;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(234,35,40,.25)}}
.rtime{text-align:center;font-size:30px;font-variant-numeric:tabular-nums}
.pbar{height:12px;border-radius:99px;background:var(--soft);overflow:hidden;margin:12px 0}
.pbar i{display:block;height:100%;background:var(--good);width:0;transition:width .3s}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#151313;color:#fff;padding:14px 22px;border-radius:14px;font-size:20px;font-weight:700;z-index:60;max-width:90vw;text-align:center}
.toast[hidden]{display:none}
.center{text-align:center}
.err{padding:40px 10px;text-align:center;font-size:22px}
.rules.top{border:2px solid #f08c00;background:#fff8e6;margin-bottom:6px}
.pq{margin-top:12px}.pql{font-size:18px;font-weight:700;margin-bottom:6px}.pscale{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.pscale.big{grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.pn{min-height:52px;border-radius:12px;border:2px solid var(--line);background:#fff;font:inherit;font-size:22px;font-weight:800;cursor:pointer}.pn.pg{color:#2b8a3e}.pn.pw{color:#e67700}.pn.pr{color:#c92a2a}.pn.sel{background:#151313;color:#fff;border-color:#151313}.pscale.big .pn{min-height:64px;font-size:26px}
</style>
<style>
.band img{height:56px}
.tabs2{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 2px}
.tabs2 button{font:inherit;font-size:19px;font-weight:700;border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 18px;cursor:pointer}
.tabs2 button[aria-pressed=true]{background:#151313;color:#fff;border-color:#151313}
.ssl{display:inline-grid;place-items:center;min-width:38px;height:38px;border-radius:12px;background:#151313;color:#fff;font-weight:700;font-size:18px;margin-inline-end:10px;flex:none;padding:0 6px}
.dose b{direction:ltr;unicode-bidi:isolate}
.sets{margin-top:12px;display:grid;gap:8px}
.setr{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px;align-items:center}
.setr span{font-weight:700;color:var(--muted);font-size:18px;min-width:52px}
.setr label{display:flex;flex-direction:column;font-size:15px;color:var(--muted)}
.setr input{font:inherit;font-size:24px;font-weight:700;text-align:center;border:2px solid var(--line);border-radius:12px;padding:8px 4px;width:100%;direction:ltr}
.setr input:focus{outline:none;border-color:#151313}
.addset{background:none;border:0;color:var(--muted);font:inherit;font-size:17px;text-decoration:underline;cursor:pointer;padding:4px 0;justify-self:start}
.prevl{margin-top:8px;font-size:17px;color:var(--muted)}
.hist .it{border-top:1px solid var(--line);padding:10px 0;font-size:18px}.hist .it:first-child{border-top:0}
.hist .d{color:var(--muted);font-size:16px}
.reply{margin-top:6px;padding:8px 12px;border-radius:12px;background:var(--good-bg);font-size:18px}
.big{width:100%;min-height:64px;font-size:22px}
.sticky{position:sticky;bottom:0;padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.media video,.media img{width:100%;border-radius:14px;display:block;margin-top:8px;background:#000}
.play{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:20px;font-weight:700;cursor:pointer;flex-direction:column}
</style>
</head>

<div class="band"><img src="logo.png" alt="כוח מחודש"><div class="fz"><button data-fz="-1" aria-label="הקטנת כתב">א-</button><button data-fz="1" aria-label="הגדלת כתב">א+</button></div></div>
<main id="app"><p class="center sub" style="margin-top:40px">טוען את התוכנית שלך…</p></main>

<div class="toast" id="toast" hidden></div>
<input type="file" id="pick" accept="image/*,video/*" hidden>
<script>
/* ===== הצפנה לדף המטופל: מפתח אקראי שנמצא רק בקישור שהמטופל קיבל (אחרי ה-#, לא נשלח לשרת) ===== */
var PC=(function(){
  var TE=new TextEncoder(),TD=new TextDecoder(),CH=4*1024*1024;
  function b64(buf){var a=new Uint8Array(buf),s='',C=0x8000;for(var i=0;i<a.length;i+=C)s+=String.fromCharCode.apply(null,a.subarray(i,i+C));return btoa(s)}
  function unb64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
  function b64u(a){return b64(a).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
  function unb64u(s){s=String(s).replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return unb64(s)}
  function hex(buf){var a=new Uint8Array(buf),o='';for(var i=0;i<a.length;i++)o+=(a[i]<16?'0':'')+a[i].toString(16);return o}
  function sha(bytes){return crypto.subtle.digest('SHA-256',bytes)}
  function rnd(n){return crypto.getRandomValues(new Uint8Array(n))}
  function key(raw){return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt'])}
  function wOf(raw){var a=new Uint8Array(raw.length+1);a.set(raw);a[raw.length]=119;return sha(a).then(hex)}
  function wthOf(w){return sha(TE.encode(w)).then(hex)}
  function encB(k,bytes){var iv=rnd(12);return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,bytes).then(function(ct){var o=new Uint8Array(12+ct.byteLength);o.set(iv,0);o.set(new Uint8Array(ct),12);return o})}
  function decB(k,bytes){bytes=new Uint8Array(bytes);return crypto.subtle.decrypt({name:'AES-GCM',iv:bytes.subarray(0,12)},k,bytes.subarray(12))}
  function encJ(k,obj){return encB(k,TE.encode(JSON.stringify(obj))).then(b64)}
  function decJ(k,s){return decB(k,unb64(s)).then(function(pt){return JSON.parse(TD.decode(pt))})}
  function readAB(b){if(b.arrayBuffer)return b.arrayBuffer();return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=rej;r.readAsArrayBuffer(b)})}
  /* מצפין קובץ גדול בחלקים של 4MB ומעלה אחד-אחד */
  function putBlob(k,blob,put,prog){var n=Math.max(1,Math.ceil(blob.size/CH)),i=0;
    function step(){if(i>=n)return Promise.resolve(n);return readAB(blob.slice(i*CH,(i+1)*CH)).then(function(ab){return encB(k,new Uint8Array(ab))}).then(function(ct){return put(i,ct,n)}).then(function(){i++;if(prog)prog(i/n);return step()})}
    return step()}
  function getBlob(k,n,get,type,prog){var parts=[],i=0;
    function step(){if(i>=n)return Promise.resolve(new Blob(parts,{type:type||''}));return get(i).then(function(ab){return decB(k,new Uint8Array(ab))}).then(function(pt){parts.push(pt);i++;if(prog)prog(i/n);return step()})}
    return step()}
  function id(n){return b64u(rnd(n||12)).replace(/[^A-Za-z0-9]/g,'x')}
  function rid(){var a=rnd(10),s='',c='abcdefghijklmnopqrstuvwxyz0123456789';for(var i=0;i<a.length;i++)s+=c[a[i]%36];return s}
  return {b64:b64,unb64:unb64,b64u:b64u,unb64u:unb64u,rnd:rnd,key:key,wOf:wOf,wthOf:wthOf,encB:encB,decB:decB,encJ:encJ,decJ:decJ,putBlob:putBlob,getBlob:getBlob,id:id,rid:rid}
})();

(function(){
var BASE='https://yaringohar.com/clinic/';
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function lsg(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lss(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function ltr(x){return '<b dir="ltr">'+esc(x)+'</b>'}
var FZ=+(lsg('rs_fz')||1);function setFz(v){FZ=Math.max(1,Math.min(1.6,Math.round(v*10)/10));document.documentElement.style.setProperty('--fz',FZ);lss('rs_fz',FZ)}setFz(FZ);
document.querySelector('.fz').addEventListener('click',function(e){var b=e.target.closest('[data-fz]');if(b)setFz(FZ+0.1*(+b.getAttribute('data-fz')))});
function toast(m){var t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},3400)}
function sheet(h){$('sbox').innerHTML=h;$('sheet').hidden=false}
function unsheet(){$('sheet').hidden=true;$('sbox').innerHTML=''}
$('sheet').addEventListener('click',function(e){if(e.target===$('sheet'))unsheet()});
function post(path,body){return fetch(BASE+'pa/'+path,{method:'POST',cache:'no-store',credentials:'omit',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){if(!r.ok)throw new Error(r.status);var ct=r.headers.get('Content-Type')||'';return ct.indexOf('json')>=0?r.json():r.arrayBuffer()})}
function fail(m){$('app').innerHTML='<div class="err">'+m+'</div>'}
function dmy(iso){return iso?iso.slice(8,10)+'.'+iso.slice(5,7):''}
function dt(t){var d=new Date(t);return d.getDate()+'.'+(d.getMonth()+1)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}

window.TTSB='https://yaringohar.com/clinic/';
var TTS=!!(window.speechSynthesis&&window.SpeechSynthesisUtterance),SAYING=null;
var UTT=null,HEV=null;function vScore(x){var n=String(x.name||''),v=0;if(/natural|neural|online/i.test(n))v+=8;if(/enhanced|premium|משופר|איכות/i.test(n))v+=6;if(/hila|carmit|כרמית|הילה/i.test(n))v+=3;if(/google/i.test(n))v+=2;if(/asaf|אסף/i.test(n))v-=1;if(x.localService===false)v+=1;return v}
function heVoice(){var L=(window.speechSynthesis.getVoices()||[]).filter(function(x){return /^he|^iw/i.test(x.lang)});L.sort(function(a,b){return vScore(b)-vScore(a)});return L[0]||null}
if(TTS){HEV=heVoice();try{window.speechSynthesis.onvoiceschanged=function(){HEV=heVoice()}}catch(e){}}
var GAUD=null,GPRE=null;
/* טקסט ברור להקראה: טווחים, כפול, ק"ג וחצאים נקראים במילים */
function ttsClean(t){return String(t).replace(/(\d+(?:\.\d+)?)\s*[-–]\s*(\d+(?:\.\d+)?)/g,'$1 עד $2').replace(/(\d)\s*[×xX]\s*(\d)/g,'$1 פעמים $2').replace(/×/g,' פעמים ').replace(/ק"ג|ק״ג|\bקג\b/g,'קילו').replace(/(\d+)\.5\b/g,'$1 וחצי').replace(/[()\[\]*_#\/\\|•]/g,' ').replace(/\s+/g,' ').trim()}
function ttsChunks(t){var out=[],cur='';String(t).replace(/\s+/g,' ').replace(/([.:,!?])\s/g,'$1\u0001').split('\u0001').forEach(function(p){if(cur&&(cur+' '+p).length>180){out.push(cur);cur=p}else cur=cur?cur+' '+p:p;while(cur.length>190){var i=cur.lastIndexOf(' ',180);if(i<40)i=180;out.push(cur.slice(0,i));cur=cur.slice(i).trim()}});if(cur)out.push(cur);return out}
function ttsUrl(x){return (window.TTSB||BASE)+'tts?v=g9&q='+encodeURIComponent(x)}
/* הקראה מהשרת שלנו (קול עברי ברור), עובדת גם בדפדפן שנפתח מתוך ווטסאפ */
function gsay(text,btn,onfail){var ch=ttsChunks(text),i=0,a=GPRE||new Audio();GPRE=null;if(GAUD&&GAUD!==a)try{GAUD.pause()}catch(e){}GAUD=a;SAYING=btn;btn.classList.add('on');a.muted=false;
  function end(){if(SAYING===btn){SAYING=null;btn.classList.remove('on')}}
  function fail(){if(GAUD!==a)return;GAUD=null;end();if(onfail)onfail()}
  a.onended=function(){if(GAUD!==a)return;i++;if(i<ch.length){a.src=ttsUrl(ch[i]);var p=a.play();if(p&&p.catch)p.catch(fail)}else{GAUD=null;end()}};a.onerror=fail;
  if(a.src.indexOf(ttsUrl(ch[0]))<0)a.src=ttsUrl(ch[0]);try{a.currentTime=0}catch(e){}var p=a.play();if(p&&p.catch)p.catch(fail)}
function ttsOff(){toast('ההקראה לא זמינה כרגע. נסו שוב בעוד רגע.')}
function say(text,btn){
  text=ttsClean(text);
  if(SAYING===btn){if(GAUD){try{GAUD.pause()}catch(e){}GAUD=null}if(TTS)window.speechSynthesis.cancel();SAYING=null;btn.classList.remove('on');return}
  if(GAUD){try{GAUD.pause()}catch(e){}GAUD=null}
  /* מכינים נגן כבר בלחיצה, כדי שאם קול המכשיר לא יעבוד, הגיבוי יוכל להתנגן (בטלפונים מותר רק בלחיצה) */
  var first=ttsChunks(text)[0]||text;try{GPRE=new Audio(ttsUrl(first));GPRE.muted=true;var pp=GPRE.play();if(pp&&pp.then)pp.then(function(){if(GPRE){GPRE.pause();try{GPRE.currentTime=0}catch(e){}}}).catch(function(){})}catch(e){GPRE=null}
  /* קודם הקול הטבעי מהשרת (נעים וברור), ואם לא זמין: הקול של המכשיר */
  gsay(text,btn,function(){devSay(text,btn)})}
function devSay(text,btn){
  if(!TTS||!(HEV||heVoice())){ttsOff();return}
  var ss=window.speechSynthesis;
